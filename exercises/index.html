<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Exercises</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2a37; --muted: #6b7280; --line: #e5e1d8;
    --accent: #2f6fdb; --accent-soft: #e6eefc; --good: #1f9d55; --good-soft: #dcf5e6;
    --bad: #d64545; --bad-soft: #fde4e4; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { margin: 26px 0 0; font-size: 20px; color: var(--muted); }
  .hint { color: var(--muted); font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 16px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 22px 12px;
    text-align: center; cursor: pointer; font-size: 20px; font: inherit; color: inherit; }
  .tile:hover, .tile:focus-visible { border-color: var(--accent); outline: none; }
  .tile .ico { font-size: 52px; display: block; margin-bottom: 8px; }
  .tile small { display: block; color: var(--muted); font-size: 15px; margin-top: 4px; }
  button.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 12px 20px;
    border-radius: 10px; font-size: 18px; cursor: pointer; font-family: inherit; }
  button.btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .center { justify-content: center; text-align: center; }
  .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .spacer { flex: 1; }
  .progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 0 0 18px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .hidden { display: none !important; }

  /* flashcard */
  .flash { min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 2px solid var(--line); border-radius: var(--radius); background: var(--card); cursor: pointer; padding: 20px; user-select: none; text-align: center; }
  .flash .pic { font-size: 90px; line-height: 1.1; }
  .flash .word { font-size: 46px; font-weight: 700; margin-top: 6px; }
  .flash .sub { color: var(--muted); margin-top: 10px; }

  /* match */
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .match .col { display: flex; flex-direction: column; gap: 10px; }
  .opt { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; font: inherit;
    font-size: 20px; cursor: pointer; text-align: left; color: var(--ink); }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt.done { border-color: var(--good); background: var(--good-soft); cursor: default; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* quiz + test */
  .q { text-align: center; }
  .q .pic { font-size: 90px; line-height: 1.1; }
  .q .sl { font-size: 30px; font-weight: 600; margin: 6px 0 16px; }
  .q .stem { font-size: 28px; font-weight: 600; margin: 10px 0 20px; line-height: 1.4; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .choices .opt { text-align: center; font-size: 22px; }

  /* gap fill */
  .gap-line { font-size: 26px; line-height: 1.9; margin: 8px 0; }
  .gap-line input { font: inherit; font-size: 24px; width: 8em; max-width: 45vw; text-align: center; padding: 4px 8px;
    border: 2px solid var(--line); border-radius: 8px; }
  .gap-line input.ok { border-color: var(--good); background: var(--good-soft); }
  .gap-line input.no { border-color: var(--bad); background: var(--bad-soft); }
  .gap-line .ans { color: var(--good); font-size: 18px; margin-left: 8px; }

  .result { text-align: center; padding: 20px 0; }
  .result .big { font-size: 64px; }
  .result .score { font-size: 32px; font-weight: 700; margin: 6px 0 16px; }
  @media (max-width: 560px) { .match, .choices { grid-template-columns: 1fr; } }

  /* ---- centred layout ---- */
  h1, h2, .hint { text-align: center; }
  .card { text-align: center; }
  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .tile { width: 210px; }
  .expl { margin: 14px auto 0; max-width: 560px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); border-left: 4px solid var(--accent); font-size: 16px; line-height: 1.5; text-align: left; }
  /* puzzles: word search, hangman, scramble, crossword */
  .ws { display: grid; gap: 2px; width: min(100%, 460px); margin: 10px auto; user-select: none; }
  .ws .wsc { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--card, #fff); border: 1px solid var(--line, #d9d9e3); border-radius: 6px; font-weight: 700; text-transform: uppercase; cursor: pointer; font-size: clamp(13px, 3.4vw, 20px); padding: 0; color: inherit; }
  .ws .wsc.sel { background: var(--accent-soft); border-color: var(--accent); }
  .ws .wsc.found { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .ws .wsc.no { background: #fde2e2; }
  .wslist { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; }
  .wslist span { padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); font-size: 15px; }
  .wslist span.got { text-decoration: line-through; opacity: .55; }
  .hm { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
  .hm svg { width: 120px; height: 140px; stroke: currentColor; stroke-width: 4; fill: none; stroke-linecap: round; }
  .hmword { font-size: 30px; letter-spacing: 6px; font-weight: 700; text-transform: uppercase; margin: 10px 0; min-height: 40px; }
  .keys { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 520px; margin: 8px auto; }
  .keys button { width: 38px; height: 40px; border-radius: 8px; border: 1px solid var(--line, #d9d9e3); background: var(--card, #fff); font-weight: 700; cursor: pointer; text-transform: uppercase; color: inherit; }
  .keys button.hit { background: var(--good-soft); border-color: var(--good); }
  .keys button.miss { background: #fde2e2; opacity: .6; }
  .tiles2 { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
  .tiles2 span { min-width: 38px; padding: 8px 6px; border-radius: 8px; background: var(--accent-soft); font-size: 24px; font-weight: 700; text-transform: uppercase; }
  .cw { border-collapse: collapse; margin: 10px auto; }
  .cw td { width: 34px; height: 34px; padding: 0; position: relative; border: 1px solid #8b93a7; background: var(--card, #fff); }
  .cw td.black { background: transparent; border-color: transparent; }
  .cw td .num { position: absolute; top: 0; left: 2px; font-size: 10px; line-height: 1; color: var(--muted, #667); pointer-events: none; }
  .cw td input { width: 100%; height: 100%; border: 0; text-align: center; font-size: 18px; font-weight: 700; text-transform: uppercase; background: transparent; color: inherit; padding: 8px 0 0; }
  .cw td.ok { background: var(--good-soft); } .cw td.no { background: #fde2e2; }
  .clues { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; text-align: left; font-size: 15px; }
  .clues ol { margin: 4px 0; padding-left: 0; list-style: none; } .clues li { margin: 2px 0; }
  /* tarsia: a triangle of 16 pieces; tap a piece, then a place on the board */
  .tg { width: min(100%, 640px); margin: 8px auto; display: block; touch-action: manipulation; }
  .tg .slot { fill: var(--card, #fff); stroke: var(--line, #b9bfd0); stroke-width: 1.2; cursor: pointer; }
  .tg .slot.has { fill: var(--accent-soft, #fdeedd); }
  .tg .slot.sel { stroke: var(--accent, #e8710a); stroke-width: 3.5; }
  .tg text { fill: currentColor; pointer-events: none; font-family: inherit; }
  .tg .good { stroke: var(--good, #1f9d55); stroke-width: 4.5; stroke-linecap: round; pointer-events: none; }
  .tg .bad { stroke: #e06060; stroke-width: 2.5; stroke-dasharray: 4 3; pointer-events: none; }
  .tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
  .tray svg { width: 132px; height: 118px; cursor: pointer; border-radius: 8px; border: 2px solid transparent; }
  .tray svg.sel { border-color: var(--accent, #e8710a); background: var(--accent-soft, #fdeedd); }
  .tray svg polygon { fill: var(--accent-soft, #fdeedd); stroke: var(--line, #b9bfd0); stroke-width: 1.5; }
  .tray svg text { fill: currentColor; pointer-events: none; font-family: inherit; }
  /* mind map: sort the words into the branches */
  .mm { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 10px 0; text-align: left; }
  .mmb { border: 2px solid var(--line, #d9d9e3); border-left-width: 8px; border-radius: 12px; padding: 8px 10px; min-height: 96px; background: var(--card, #fff); cursor: pointer; }
  .mmb h3 { margin: 0 0 6px; font-size: 16px; }
  .mmb .got { display: flex; flex-wrap: wrap; gap: 4px; }
  .mmb .got span { background: var(--good-soft, #dcf5e6); border-radius: 999px; padding: 1px 9px; font-size: 14px; }
  .mmb.no { background: #fde2e2; }
  .mmcentre { display: inline-block; font-weight: 700; font-size: 20px; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--accent, #e8710a); background: var(--accent-soft, #fdeedd); margin: 6px 0; }
  .mmbank { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; }
  .mmbank button { border: 1px solid var(--line, #d9d9e3); background: var(--card, #fff); border-radius: 999px; padding: 6px 14px; font: inherit; color: inherit; cursor: pointer; }
  .mmbank button.sel { border-color: var(--accent, #e8710a); background: var(--accent-soft, #fdeedd); font-weight: 700; }
  .expl .sl { margin-top: 4px; color: var(--muted, #556); }
  .expl.more { font-size: 14px; }
  .gap-line .expl { display: block; margin: 6px 0 4px; font-size: 15px; }
  .hintsl { margin: 12px auto 0; max-width: 520px; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 16px; line-height: 1.45; text-align: left; }
  .gram { text-align: left; max-width: 760px; margin: 0 auto; }
  .gsec { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 14px; }
  .gsec h3 { margin: 0 0 8px; font-size: 20px; }
  .gsec p { margin: 6px 0; line-height: 1.55; }
  .gwrap { overflow-x: auto; margin: 10px 0; }
  .gtab { border-collapse: collapse; font-size: 16px; }
  .gtab th, .gtab td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
  .gtab th { background: var(--accent-soft); }
  .gex { margin: 10px 0 0; padding-left: 22px; line-height: 1.6; }
  .gex .en { font-weight: 600; }
  .gex .sl { color: var(--muted); }
  .gtip { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); line-height: 1.5; }
  .match, .choices { max-width: 640px; margin-left: auto; margin-right: auto; }
  .match .opt { text-align: center; }
  .gap-line { text-align: center; }
  .top { justify-content: space-between; }

  /* sign-in bar + save status */
  .who { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    min-height: 52px; margin: 0 auto 14px; padding: 8px 14px; max-width: 640px; font-size: 16px; color: var(--ink);
    background: var(--accent-soft); border: 1px solid #c5d6f4; border-radius: var(--radius); }
  .who.on { background: var(--good-soft); border-color: #b4e2c6; }
  .who button { font-size: 15px; padding: 6px 12px; }
  /* homework box */
  .hw { max-width: 640px; margin: 0 auto 18px; text-align: left; }
  .hw h2 { margin: 0 0 8px; color: var(--ink); font-size: 20px; text-align: left; }
  .hw .item { background: var(--card); border: 2px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; }
  .hw .item.done { border-color: var(--good); background: var(--good-soft); }
  .hw .ttl { font-weight: 700; font-size: 19px; }
  .hw .meta { color: var(--muted); font-size: 15px; margin: 2px 0 8px; }
  .hw .meta .late { color: var(--bad); font-weight: 700; }
  .hw .note { font-size: 16px; margin: 0 0 8px; }
  .hw .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .hw .acts button.btn { padding: 8px 14px; font-size: 16px; }
  .hw .acts button.ok { border-color: var(--good); background: var(--good-soft); }
  .hw .acts button.part { border-color: var(--bad); }
  .prog details { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px 16px; }
  .prog summary { cursor: pointer; font-weight: 700; font-size: 18px; }
  .prog summary small { font-weight: 400; color: var(--muted); font-size: 15px; margin-left: 6px; }
  .prog .tiles { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .prog .tl { flex: 1 1 110px; background: var(--accent-soft); border-radius: 12px; padding: 8px 10px; text-align: center; }
  .prog .tl b { display: block; font-size: 26px; line-height: 1.1; }
  .prog .tl span { color: var(--muted); font-size: 14px; }
  .prog h3 { margin: 14px 0 6px; font-size: 16px; }
  .prog .row2 { display: flex; align-items: center; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .prog .row2 .nm { flex: 1 1 200px; }
  .prog .row2 .pc { font-weight: 700; }
  .prog .row2 button.btn { padding: 4px 12px; font-size: 15px; }
  .savemsg { font-size: 16px; margin: 0 0 14px; color: var(--muted); }
  .savemsg.ok { color: var(--good); }
  .savemsg.warn { color: var(--bad); }
  details.extra { margin-top: 18px; } details.extra > summary { cursor: pointer; font-weight: 700; font-size: 1.05rem; padding: 10px 14px; border: 1px solid var(--line, #ddd); border-radius: 12px; background: var(--card, #fff); list-style: none; } details.extra[open] > summary { margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <div id="who" class="who hidden"></div>
  <div id="hw" class="hw hidden"></div>
  <div id="goal" class="hw goal hidden"></div>
  <div id="prog" class="hw prog hidden"></div>
  <div id="home">
    <h1 id="homeTitle">English Exercises</h1>
    <p class="hint" id="homeHint"></p>
    <div id="homeBody"></div>
  </div>

  <div id="menu" class="hidden">
    <div class="top"><button class="btn" id="backHome">← All topics</button></div>
    <h1 id="menuTitle"></h1>
    <p class="hint">Choose an activity.</p>
    <div class="grid" id="modeGrid"></div>
  </div>

  <div id="play" class="hidden">
    <div class="top">
      <button class="btn" id="backMenu">← Activities</button>
      <span class="spacer"></span>
      <span class="hint" id="playInfo"></span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="card" id="stage"></div>
  </div>
</main>

<script src="classes.js"></script>
<script src="sets.js"></script>
<script src="hints.js"></script>
<script src="levels-1.js"></script>
<script src="levels-2.js"></script>
<script src="levels-3.js"></script>
<script src="levels-4.js"></script>
<script src="levels-5.js"></script>
<script src="levels-6.js"></script>
<script src="explain.js"></script>
<script src="puzzles.js"></script>
<script src="tarsia.js"></script>
<script src="mindmaps.js"></script>
<script src="tracking.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  // Exercise banks are bigger than one session: pick() prefers items this browser has not shown yet
  // (remembered per class/unit/activity in localStorage), so a repeat attempt brings new questions.
  const idOf = x => (x.q || x.text || x.en || '') + '|' + (x.answer || '');
  const pick = (items, n, kind) => {
    const key = (new URLSearchParams(location.search).get('class') || '') + '/' + (set ? set.id + (set.level ? '.' + set.level : '') : '') + '/' + kind;
    let store = {}; try { store = JSON.parse(localStorage.getItem('eh.seen') || '{}'); } catch (e) {}
    let seen = new Set(store[key] || []);
    let fresh = shuffle(items.filter(x => !seen.has(idOf(x))));
    let out = fresh.slice(0, n);
    if (out.length < n) {                       // bank used up: start a new round
      seen = new Set();
      out = out.concat(shuffle(items.filter(x => !out.includes(x))).slice(0, n - out.length));
      out = out.slice(0, n);
      seen = new Set(out.slice(fresh.length).map(idOf));
    }
    out.forEach(x => seen.add(idOf(x)));
    store[key] = [...seen].slice(-400);
    try { localStorage.setItem('eh.seen', JSON.stringify(store)); } catch (e) {}
    return shuffle(out);
  };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // typed answers are compared in a normal form: contractions are opened (I'm = I am, don't = do not), so both are accepted.
  // Only unambiguous forms are opened: 's and 'd are left alone (he's = he is / he has, I'd = I would / I had), except it's/he's/she's/that's/there's/what's/here's = ... is
  const norm = s => s.trim().toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s+/g, ' ')
    .replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not').replace(/\bshan't\b/g, 'shall not')
    .replace(/\b(\w+)n't\b/g, '$1 not').replace(/\bi'm\b/g, 'i am')
    .replace(/\b(\w+)'(re|ve|ll)\b/g, (m, w, x) => w + ' ' + (x === 're' ? 'are' : x === 've' ? 'have' : 'will'))
    .replace(/\b(it|he|she|that|there|what|here)'s\b/g, '$1 is');
  // short explanation after a wrong answer: window.EXPLAIN (explain.js) maps the question text (lower case) to [English, Slovenian].
  // Without an entry, a question of a unit that has a Grammar text only points to it. Returns true when something was shown.
  // A key can also be "question||right answer" (for questions that share their text, like "Which sentence is correct?"); it is tried first.
  const explOf = (q, ans) => { const X = window.EXPLAIN || {}, k = String(q).trim().toLowerCase(); let e = X[k + '||' + String(ans == null ? '' : ans).trim().toLowerCase()] || X[k]; return e && !Array.isArray(e) ? [e] : e; };
  const explBox = (q, into, ans) => {
    const e = explOf(q, ans);
    const box = el('div', 'expl');
    if (e) { box.append(el('div', 'en', '💬 ' + e[0])); if (e[1]) box.append(el('div', 'sl', e[1])); }
    else if (set && (set.grammar || []).length) { box.classList.add('more'); box.append(el('div', '', '📖 More about this in the Grammar of this unit. / Več o tem najdeš v slovnici te enote.')); }
    else return false;
    into.append(box); return e ? 2 : 1;           // 2 = a written explanation (the pupil presses Next), 1 = only the pointer to the Grammar (moves on by itself)
  };
  const show = id => { ['home', 'menu', 'play'].forEach(x => $('#' + x).classList.toggle('hidden', x !== id)); $('#hw').classList.toggle('hidden', id === 'play' || !$('#hw').childNodes.length); $('#prog').classList.toggle('hidden', id !== 'home' || !$('#prog').childNodes.length); $('#goal').classList.toggle('hidden', id !== 'home' || !$('#goal').childNodes.length); };
  const setBar = f => $('#bar').style.width = Math.round(f * 100) + '%';

  let set = null, mode = null;

  // ----- progress tracking (see tracking.js; does nothing until it is configured) -----
  const whoBar = () => {
    const w = $('#who'); if (!Track.enabled) return;
    w.classList.remove('hidden'); w.classList.toggle('on', !!Track.email); w.innerHTML = '';
    if (Track.email) {
      const out = el('button', 'btn', 'Sign out'); out.onclick = () => Track.signOut();
      w.append(document.createTextNode('✓ Saving results for ' + Track.email), out);
    } else {
      const box = el('span'); w.append(el('span', '', '💾 Sign in with your school account to save your results:'), box);
      Track.button(box);
    }
  };
  // ----- homework: the teacher's assignments for this pupil's class (asked from the server once signed in) -----
  const MODE_IDS = { match: 'Match', quiz: 'Quiz', gap: 'Fill the gap', test: 'Unit test', test2: 'Unit test 2', gcheck: 'Grammar quick check' };
  // homework and "My progress" come in ONE request (action pupilhome): half the requests to the Sheet, which makes the page much quicker
  // when a whole class opens it at the same time. loadHw and loadProgress are the same function and share a request that is already running.
  let homeBusy = null;
  const loadHome = () => {
    const token = Track.enabled && Track.token();
    if (!token) { ['#hw', '#prog', '#goal'].forEach(s => { $(s).innerHTML = ''; $(s).classList.add('hidden'); }); return Promise.resolve(); }
    if (homeBusy) return homeBusy;
    homeBusy = fetch(Track.config.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'pupilhome', token }) })
      .then(r => r.json())

      }

    };

    card.onclick = doFlip; flip.onclick = doFlip;

  // ----- match -----
  function match() {
    const words = pick(set.words, 6, 'match');
    const left = shuffle(words), right = shuffle(words);
    let selL = null, selR = null, done = 0, mistakes = 0; detail = []; const wrongOf = new Map();
    const s = stage(); const grid = el('div', 'match'); const cl = el('div', 'col'), cr = el('div', 'col');
    grid.append(cl, cr); s.append(el('p', 'hint', 'Click a word on the left, then its match on the right.'), grid);
    const mk = (w, side) => {
      const b = el('button', 'opt', side === 'L' ? w.en : ((w.pic ? w.pic + ' ' : '') + (w.sl || '')));
      b.onclick = () => {
        if (b.classList.contains('done')) return;
        if (side === 'L') { if (selL) selL.b.classList.remove('sel'); selL = { w, b }; b.classList.add('sel'); }
        else { if (selR) selR.b.classList.remove('sel'); selR = { w, b }; b.classList.add('sel'); }
        if (selL && selR) {
          if (sameSl(selL.w, selR.w)) {
            [selL.b, selR.b].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); });
            done++; setBar(done / words.length); selL = selR = null;
            if (done === words.length) { words.forEach(w => rec(w.en, w.sl || '', (wrongOf.get(w) || []).join(' / '), !wrongOf.has(w))); }
            if (done === words.length) setTimeout(() => finish(Math.max(0, words.length - mistakes), words.length, match), 500);
          } else {
            mistakes++; wrongOf.set(selL.w, (wrongOf.get(selL.w) || []).concat(selR.w.sl || '')); const a = selL.b, c = selR.b; a.classList.add('wrong'); c.classList.add('wrong');
            setTimeout(() => { [a, c].forEach(x => x.classList.remove('wrong', 'sel')); }, 400);
            selL = selR = null;
          }
        }
      };
      return b;
    };

  function askConfidence(go) {

  const CONF_WORDS = ['', 'Not sure', 'A bit', 'Quite sure', 'Very sure'];
  function afterTest(r, key, pred, score, total) {

    }

  function testRun(key, pred) {
    const qs = pick(set[key], 10, key); let i = 0, score = 0; detail = [];
    // balanced answer positions: in a test each position (A-D) gets the right answer about equally often, never 3 times in a row
    let slots; for (let tries = 0; tries < 50; tries++) {
      slots = shuffle(qs.map((_, k) => k % 4));
      if (!slots.some((p, k) => k > 1 && p === slots[k - 1] && p === slots[k - 2])) break;
    }
    const ask = () => {
      const t = qs[i]; const s = stage(); const q = el('div', 'q');
      q.append(el('p', 'hint', `Question ${i + 1} of ${qs.length}`), el('div', 'stem', t.q));
      const box = el('div', 'choices');
      const opts = shuffle(t.options), at = opts.indexOf(t.answer), want = Math.min(slots[i], opts.length - 1);
      if (at >= 0 && at !== want) [opts[at], opts[want]] = [opts[want], opts[at]];
      opts.forEach(o => {
        const b = el('button', 'opt', o);
        b.onclick = () => {

          else { b.classList.add('wrong'); [...box.children].find(x => x.textContent === t.answer).classList.add('done'); }
          i++; setBar(i / qs.length);
          const go = () => i < qs.length ? ask() : finish(score, qs.length, () => test(key), { pred, after: r => afterTest(r, key, pred, score, qs.length) });
          const ex = o !== t.answer ? explBox(t.q, q, t.answer) : 0;
          if (ex === 2) {                    // wrong answer with a written explanation: the pupil reads it and presses Next

  // ----- practise my mistakes: the pupil's own wrong answers in this unit (asked from the server after sign-in) -----
  // The server returns the questions as they were saved (text cut to 110 / 90 characters); each one is found again in the unit's
  // own exercise bank so that it can be asked in the same form (choice or typed gap). The answers are saved under the original
  // question text, so a question the pupil now gets right disappears from the list.
  const clipQ = (v, n) => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n);
  const savedAs = (v, n) => clipQ(v, n).replace(/^'(?=[=+\-@])/, '');
  const mistakeQuestions = (items, s) => {
    const out = [], W = s.words || [], same = (a, b, n) => savedAs(a, n) === savedAs(b, n);
    items.forEach(it => {
      const q = savedAs(it.q, 110), ans = savedAs(it.ans, 90);
      if (it.act === 'Quiz') {
        const w = W.find(x => same('"' + (x.sl || '') + '" in English', q, 110) && same(x.en, ans, 90)); if (!w) return;
        const opts = shuffle([w, ...shuffle(W.filter(x => !sameSl(x, w))).slice(0, 3)]).map(x => x.en);
        out.push({ pic: w.pic, stem: w.sl || '', hint: 'Which English word is this?', options: opts, answer: w.en, rec: [it.q, it.ans] });
      } else if (it.act === 'Match') {
        const w = W.find(x => same(x.en, q, 110) && same(x.sl || '', ans, 90)); if (!w) return;
        const opts = [...new Set([w.sl, ...shuffle(W.filter(x => x.sl && x.sl !== w.sl)).slice(0, 6).map(x => x.sl)].slice(0, 4))];
        out.push({ pic: w.pic, stem: w.en, hint: 'What does this word mean in Slovenian?', options: shuffle(opts), answer: w.sl, rec: [it.q, it.ans] });
      } else if (it.act === 'Fill the gap') {
        const g = (s.sentences || []).find(x => same(x.text, q, 110) && same(x.answer, ans, 90)); if (!g) return;
        out.push({ gap: g, rec: [it.q, it.ans] });
      } else {
        const key = it.act === 'Unit test' ? 'tests' : it.act === 'Unit test 2' ? 'tests2' : it.act === 'Grammar quick check' ? 'gcheck' : null; if (!key) return;
        const t = (s[key] || []).find(x => same(x.q, q, 110) && same(x.answer, ans, 90)); if (!t) return;
        out.push({ stem: t.q, options: shuffle(t.options.slice()), answer: t.answer, rec: [it.q, it.ans] });
      }
    });
    return out;
  };

  // word search: tap the first and the last letter of a word; the list shows the Slovenian meanings
  function wordsearch() {

    if (!g.placed.length) { s.append(el('p', 'hint', 'This unit has too few single words for a word search.')); return; }
    s.append(el('p', 'hint', 'Find the English words. Tap the first and then the last letter of a word. The clues are in Slovenian.'));
    const tbl = el('div', 'ws'); tbl.style.gridTemplateColumns = 'repeat(' + g.n + ', 1fr)';
    const cells = g.grid.map((row, r) => row.map((ch, c) => { const b = el('button', 'wsc', ch); b.dataset.r = r; b.dataset.c = c; tbl.append(b); return b; }));
    const list = el('div', 'wslist'), tags = g.placed.map(p => { const t = el('span', '', clueOf(p.item.w)); list.append(t); return t; });
    let first = null, found = 0, showEn = false;
    const endOf = p => [p.r + p.dr * (p.item.word.length - 1), p.c + p.dc * (p.item.word.length - 1)];
    const done = new Set();
    tbl.onclick = e => {
      const b = e.target.closest('.wsc'); if (!b) return; const r = Number(b.dataset.r), c = Number(b.dataset.c);
      if (!first) { first = [r, c]; b.classList.add('sel'); return; }
      const [r0, c0] = first; cells[r0][c0].classList.remove('sel'); first = null;
      if (r0 === r && c0 === c) return;
      const hit = g.placed.findIndex((p, i) => { if (done.has(i)) return false; const [er, ec] = endOf(p); return (p.r === r0 && p.c === c0 && er === r && ec === c) || (p.r === r && p.c === c && er === r0 && ec === c0); });
      if (hit < 0) { [cells[r0][c0], b].forEach(x => { x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 350); }); return; }
      const p = g.placed[hit]; done.add(hit); found++;
      for (let i = 0; i < p.item.word.length; i++) cells[p.r + p.dr * i][p.c + p.dc * i].classList.add('found');
      tags[hit].classList.add('got'); tags[hit].textContent = clueOf(p.item.w) + ' = ' + Puzzles.show(p.item.w);
      setBar(found / g.placed.length);

  // hangman: a Slovenian clue, guess the English word (also phrases); 7 wrong letters and the man is hanged
  function hangman() {
    const ok = w => { const e = Puzzles.clean(w.en); return /^[a-z' -]+$/.test(e) && e.replace(/[^a-z]/g, '').length >= 3 && e.length <= 22; };
    const words = Puzzles.shuffle(set.words.filter(ok)).slice(0, 6); let i = 0, score = 0;
    const PARTS = ['<line x1="10" y1="135" x2="90" y2="135"/>', '<line x1="30" y1="135" x2="30" y2="15"/><line x1="30" y1="15" x2="85" y2="15"/>', '<line x1="85" y1="15" x2="85" y2="32"/>',
      '<circle cx="85" cy="44" r="12"/>', '<line x1="85" y1="56" x2="85" y2="95"/>', '<line x1="85" y1="66" x2="68" y2="84"/><line x1="85" y1="66" x2="102" y2="84"/>', '<line x1="85" y1="95" x2="70" y2="122"/><line x1="85" y1="95" x2="100" y2="122"/>'];
    const round = () => {
      const w = words[i], target = Puzzles.clean(w.en), s = stage(), guessed = new Set(); let wrong = 0, over = false;
      s.append(el('p', 'hint', 'Word ' + (i + 1) + ' of ' + words.length + ' · guess the English word'), el('div', 'sl', clueOf(w)));
      const box = el('div', 'hm'), svg = el('div'), word = el('div', 'hmword'); box.append(svg, word); s.append(box);
      const keys = el('div', 'keys'), msg = el('p', 'hint'); s.append(keys, msg);
      const draw = () => {
        svg.innerHTML = '<svg viewBox="0 0 120 140">' + PARTS.slice(0, wrong).join('') + '</svg>';
        word.textContent = target.split('').map(ch => /[a-z]/.test(ch) ? (guessed.has(ch) || over ? ch : '_') : ch).join(' ');
      };
      const end = good => {
        over = true; if (good) score++; draw(); keys.querySelectorAll('button').forEach(b => b.disabled = true);
        msg.textContent = good ? '✓ Well done!' : 'The word was: ' + Puzzles.show(w);
        const nb = el('button', 'btn primary', i + 1 < words.length ? 'Next word' : 'Finish'); nb.onclick = () => { i++; setBar(i / words.length); if (i < words.length) round(); else puzzleEnd(score + ' / ' + words.length, () => { i = 0; score = 0; hangman(); }, 'Words guessed', score, words.length); };
        s.append(nb); nb.focus();
      };
      const guess = ch => {
        if (over || guessed.has(ch)) return; guessed.add(ch);
        const b = [...keys.children].find(x => x.textContent === ch.toUpperCase()); if (target.includes(ch)) b.classList.add('hit'); else { b.classList.add('miss'); wrong++; }
        draw();
        if (wrong >= PARTS.length) end(false); else if (target.split('').every(c => !/[a-z]/.test(c) || guessed.has(c))) end(true);
      };
      'abcdefghijklmnopqrstuvwxyz'.split('').forEach(ch => { const b = el('button', '', ch.toUpperCase()); b.onclick = () => guess(ch); keys.append(b); });
      window.__hmKey = e => { if (mode && mode.id === 'hangman' && !$('#play').classList.contains('hidden') && /^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) guess(e.key.toLowerCase()); };
      draw();
    };
    if (!words.length) { stage().append(el('p', 'hint', 'This unit has too few words for Hangman.')); return; }
    if (!window.__hmBound) { window.__hmBound = true; document.addEventListener('keydown', e => window.__hmKey && window.__hmKey(e)); }
    round();
  }

  // tarsia: 16 triangular pieces with a word on every side that touches another piece. Tap a piece (below the board), tap a place
  // on the board; tap a piece on the board to turn it (button) or take it back. Where two touching sides belong together they turn green.
  // the pairs of a tarsia: the English word and its Slovenian meaning; when there are fewer than 18 words (the Extra practice topics have 15 per level),
  // short gap sentences (sentence with ___ and the missing word) fill up
  const tarsiaPairs = (words, sentences) => {
    const seen = new Set(), out = [];
    (words || []).forEach(w => { const a = String(w.en || '').trim(), b = String(w.sl || '').trim(), k = b.toLowerCase(), k2 = a.toLowerCase();
      if (a && b && a.length <= 26 && b.length <= 26 && !seen.has(k) && !seen.has(k2)) { seen.add(k); seen.add(k2); out.push([a, b]); } });
    if (out.length < 18) (sentences || []).forEach(x => { const q = String(x.text || '').replace(/\s+/g, ' ').trim(), a = String(x.answer || '').trim(), k = q.toLowerCase();
      if (q && a && /___/.test(q) && q.length <= 60 && a.length <= 22 && !seen.has(k)) { seen.add(k); out.push([q, a]); } });
    return out;
  };
  function tarsia(src) {                                              // src = ready pairs [[a, b], ...] (the grammar tarsia); without it the words of the unit
    const T = Tarsia, S = 100, H = S * Math.sqrt(3) / 2, s = stage(), NS = 'http://www.w3.org/2000/svg', again = () => tarsia(src);
    const pairs = T.shuffle(src instanceof Array ? src : tarsiaPairs(set.words, set.sentences)).slice(0, T.SHAPES.tri.pairs);
    if (pairs.length < T.SHAPES.tri.pairs) { s.append(el('p', 'hint', 'This unit has too few different words for a tarsia.')); return; }
    const g = T.make('tri', pairs), ps = g.pieces.map(() => ({ slot: -1, rot: Math.floor(Math.random() * 3) }));
    let sel = -1, finished = false;
    const sv = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(k => e.setAttribute(k, attrs[k])); if (text != null) e.textContent = text; return e; };
    const occupant = k => ps.findIndex(p => p.slot === k);
    const textAt = (q, tri, side) => { const j = T.sidesOf(tri).indexOf(side); return g.pieces[q].texts[(j - ps[q].rot + 3) % 3]; };
    const edgeState = e => {                                       // 'good' = a pair that belongs together, 'bad' = two pieces that do not fit, '' = a place is empty
      const qa = occupant(e.a.t.k), qb = occupant(e.b.t.k); if (qa < 0 || qb < 0) return '';
      const ta = textAt(qa, e.a.t, e.a.side), tb = textAt(qb, e.b.t, e.b.side); return ta && tb && ta.pid === tb.pid ? 'good' : 'bad';
    };
    s.append(el('p', 'hint', 'Every side has a word. Put the pieces together so that the touching sides are a pair (English and its Slovenian meaning, or a question and its answer). Tap a piece, then a place on the board. Green = a pair.'));
    const boardBox = el('div'), tray = el('div', 'tray'), bar = el('div', 'row center'), msg = el('p', 'hint');
    const turn = el('button', 'btn', '⟳ Turn the piece'), back = el('button', 'btn', '↩ Take it back'), show = el('button', 'btn', 'Start again');
    bar.append(turn, back, show); s.append(boardBox, bar, msg, tray);
    const labelsInto = (parent, tri, order, textOf, size) => order.forEach((side, j) => { const t = textOf(j); if (t) T.label(tri, side, t.txt, size).forEach(l => parent.append(sv('text', { transform: 'translate(' + l.x.toFixed(1) + ' ' + l.y.toFixed(1) + ') rotate(' + l.deg.toFixed(1) + ')', 'text-anchor': 'middle', 'font-size': l.size.toFixed(1) }, l.txt))); });
    const draw = () => {
      boardBox.innerHTML = ''; tray.innerHTML = '';
      const svg = sv('svg', { class: 'tg', viewBox: '-2 -2 ' + (4 * S + 4) + ' ' + (4 * H + 4) }); boardBox.append(svg);
      g.tris.forEach(t => {
        const c = T.geo(t, S), q = occupant(t.k), poly = sv('polygon', { points: c.pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), class: 'slot' + (q >= 0 ? ' has' : '') + (q >= 0 && q === sel ? ' sel' : '') });
        poly.onclick = () => { place(t.k); }; svg.append(poly);
        if (q >= 0) labelsInto(svg, t, T.sidesOf(t), j => g.pieces[q].texts[(j - ps[q].rot + 3) % 3], S);
      });
      let good = 0;
      g.edges.forEach(e => { const st = edgeState(e); if (!st) return; const c = T.geo(e.a.t, S)[e.a.side]; svg.append(sv('line', { x1: c[0][0].toFixed(1), y1: c[0][1].toFixed(1), x2: c[1][0].toFixed(1), y2: c[1][1].toFixed(1), class: st })); if (st === 'good') good++; });
      g.pieces.forEach((pc, q) => {
        if (ps[q].slot >= 0) return;
        const t = { r: 0, i: -1, up: true, k: -1 }, c = T.geo(t, S), box = sv('svg', { viewBox: '-4 -4 ' + (S + 8) + ' ' + (H + 8) + '', class: q === sel ? 'sel' : '' });
        const tr = sv('g', { transform: 'translate(' + (S / 2 - c.pts[0][0]) + ' 0)' }); box.append(tr);
        tr.append(sv('polygon', { points: c.pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ') }));
        labelsInto(tr, t, ['R', 'B', 'L'], j => pc.texts[(j - ps[q].rot + 3) % 3], S);
        box.onclick = () => { sel = sel === q ? -1 : q; draw(); }; tray.append(box);
      });
      setBar(good / g.edges.length);
      turn.disabled = back.disabled = sel < 0; back.disabled = sel < 0 || ps[sel].slot < 0;
      msg.textContent = sel < 0 ? (tray.children.length ? 'Tap a piece below, then a place on the board.' : '') : (ps[sel].slot < 0 ? 'Now tap a place on the board (or turn the piece first).' : 'Turn the piece, take it back, or tap another place to move it.');
      if (!finished && good === g.edges.length) { finished = true; setTimeout(() => puzzleEnd('Tarsia solved!', again, 'All the pairs fit together.', 1, 1), 900); }
    };
    function place(k) {
      if (finished) return;
      const q2 = occupant(k);
      if (sel < 0) { if (q2 >= 0) sel = q2; draw(); return; }
      if (q2 === sel) { sel = -1; draw(); return; }
      if (q2 >= 0) ps[q2].slot = -1;                              // the piece that was there goes back below the board
      ps[sel].slot = k; sel = -1; draw();
    }
    turn.onclick = () => { if (sel >= 0) { ps[sel].rot = (ps[sel].rot + 1) % 3; draw(); } };
    back.onclick = () => { if (sel >= 0 && ps[sel].slot >= 0) { ps[sel].slot = -1; sel = -1; draw(); } };
    show.onclick = () => { ps.forEach(p => { p.slot = -1; p.rot = Math.floor(Math.random() * 3); }); sel = -1; draw(); };
    window.__tarsia = { g, ps, draw };                                  // for testing in the browser console
    draw();
  }

  // the Grammar texts of the unit (set.grammar = [{h, l, t, x:[[EN, SL]]}], set.gcheck = quick-check questions) as material for a tarsia and a mind map
  const grammarPairs = s => {
    const seen = new Set(), out = [], add = (a, b) => { a = String(a || '').replace(/\s+/g, ' ').trim(); b = String(b || '').replace(/\s+/g, ' ').trim(); const k = a.toLowerCase(), k2 = b.toLowerCase();
      if (a && b && a.length <= 36 && b.length <= 42 && !seen.has(k) && !seen.has(k2)) { seen.add(k); seen.add(k2); out.push([a, b]); } };
    (s.grammar || []).forEach(sec => (sec.x || []).forEach(p => add(p[0], p[1])));
    ((s.gmaps && s.gmaps.pairs) || []).forEach(p => add(p[0], p[1]));
    (s.gcheck || []).forEach(q => { if (/___/.test(q.q) && q.q.length <= 44) add(q.q.replace(/\s*\([^)]*\)\s*$/, ''), q.answer); });
    (s.sentences || []).forEach(x => { if (out.length < 24 && /___/.test(x.text || '') && String(x.text).length <= 44 && String(x.answer || '').length <= 22) add(x.text, x.answer); });
    return out;
  };
  // mind maps of the grammar: branch = a section of the explanation, words = its examples and the rows of its table (go - went); returns the levels that exist
  const grammarMaps = s => {
    const levels = [['easy', 3, 3], ['medium', 4, 4], ['hard', 9, 9]], out = [], same = br => out.some(o => JSON.stringify(o.branches) === JSON.stringify(br));
    if (s.gmaps && s.gmaps.maps) {                                          // written maps (grammarmaps-<id>.js): rules x sentences
      const all = s.gmaps.maps.map(([name, txt]) => ({ name, items: txt.split(' | ').map(x => x.trim()).filter(Boolean) }));
      levels.forEach(([k, nb, ni]) => { const br = all.slice(0, nb).map(b => ({ name: b.name, items: b.items.slice(0, ni) })); if (br.length >= 3 && !same(br)) out.push({ level: k, branches: br }); });
      return out;
    }
    const seen = new Set(), secs = [];
    (s.grammar || []).forEach(sec => {
      const items = [];
      (sec.x || []).forEach(p => items.push(String(p[0]).trim()));
      (sec.t || []).slice(1).forEach(r => { if (r.length === 2 && r[0] && r[1]) items.push(r[0] + ' – ' + r[1]); });
      const u = items.filter(w => w && w.length <= 52 && !seen.has(w.toLowerCase()) && !/^\d/.test(w)); u.forEach(w => seen.add(w.toLowerCase()));
      if (u.length >= 2 && String(sec.h).length <= 44) secs.push({ name: String(sec.h).replace(/\*\*/g, ''), items: u });
    });
    if (secs.length < 3) return [];
    levels.forEach(([k, nb, ni]) => { const br = secs.slice(0, nb).map(b => ({ name: b.name, items: b.items.slice(0, ni) })); if (br.length >= 3 && !same(br)) out.push({ level: k, branches: br }); });
    return out;
  };
  function grammarMapMenu() {
    const maps = grammarMaps(set), s = stage();
    s.append(el('p', 'hint', 'Choose a level. Then sort the example sentences into the grammar rule they belong to.'));
    const g = el('div', 'grid');
    maps.forEach(m => {
      const L = LEVELS[m.level], n = m.branches.reduce((c, b) => c + b.items.length, 0), b = el('button', 'tile');
      b.append(el('span', 'ico', L[0]), document.createTextNode(L[1]), el('small', '', m.branches.length + ' rules · ' + n + ' sentences'));
      b.onclick = () => { $('#playInfo').textContent = set.title + ' · Grammar mind map · ' + L[1]; mindmapGame({ title: 'Grammar: ' + set.title, icon: '📖', branches: m.branches }); };
      g.append(b);
    });
    s.append(g);
  }
  // Extra practice topics: the mind map of the topic at the chosen level (ready-made maps of mindmaps.js; some topics have another id there)
  const MM_ALIAS = { house: 'home', sports: 'sport', technology: 'tech', nature: 'environment' };
  const mapOf = id => (window.MINDMAPS || []).find(m => m.id === (MM_ALIAS[id] || id));
  function topicMap() { const mp = mapOf(set.base.id); mindmapGame({ title: mp.title, icon: mp.icon, branches: mp.levels[set.level] }); }
  // the mind map of a unit (unitmaps-<class id>.js): first the level, then the same sorting game; the result is saved for the unit as the activity "Mind map"
  function unitMapMenu() {
    const um = window.UNITMAPS[set.id], s = stage();
    s.append(el('p', 'hint', 'Choose a level. Then sort the words of the unit into the branches of the mind map.'));
    const g = el('div', 'grid');
    Object.keys(LEVELS).filter(k => um.levels[k]).forEach(k => {
      const L = LEVELS[k], br = um.levels[k], n = br.reduce((c, b) => c + b.items.length, 0), b = el('button', 'tile');
      b.append(el('span', 'ico', L[0]), document.createTextNode(L[1]), el('small', '', br.length + ' branches · ' + n + ' words'));
      b.onclick = () => { $('#playInfo').textContent = set.title + ' · Mind map · ' + L[1]; mindmapGame({ title: um.title, icon: um.icon, branches: br }); };
      g.append(b);
    });
    s.append(g);
  }
  // mind map: sort the words into the branches. Tap a word, then the branch it belongs to; a wrong branch shakes red and counts as a mistake.
  function mindmapGame(mm) {
    const m = mm || set.mindmap, s = stage(), total = m.branches.reduce((n, b) => n + b.items.length, 0), cols = ['#e8710a', '#1f9d55', '#2563eb', '#c026d3', '#d97706', '#0e9aa7'];
    let sel = null, mistakes = 0, done = 0;
    s.append(el('p', 'hint', 'Sort the words into the right branch. Tap a word, then the branch.'), el('div', 'mmcentre', (m.icon || '🧠') + ' ' + m.title));
    const grid = el('div', 'mm'), bank = el('div', 'mmbank'), msg = el('p', 'hint');
    const cards = m.branches.map((b, i) => { const c = el('div', 'mmb'), got = el('div', 'got'); c.style.borderLeftColor = cols[i % cols.length]; c.append(el('h3', '', b.name), got); c.onclick = () => put(i, c, got); grid.append(c); return { c, got }; });
    Puzzles.shuffle(m.branches.flatMap((b, i) => b.items.map(w => ({ w, i })))).forEach(x => { const t = el('button', '', x.w); t.onclick = () => { if (sel && sel.t === t) { sel = null; t.classList.remove('sel'); return; } if (sel) sel.t.classList.remove('sel'); sel = { t, i: x.i, w: x.w }; t.classList.add('sel'); }; bank.append(t); });
    const put = (i, c, got) => {
      if (!sel) { msg.textContent = 'First tap a word below.'; return; }
      if (sel.i === i) { got.append(el('span', '', sel.w)); sel.t.remove(); sel = null; msg.textContent = ''; done++; setBar(done / total);
        if (done === total) setTimeout(() => puzzleEnd('Mind map complete!', () => mindmapGame(mm), mistakes ? 'Every word is in the right branch (' + mistakes + (mistakes === 1 ? ' mistake' : ' mistakes') + ').' : 'No mistakes at all!', Math.max(0, total - mistakes), total), 500); }
      else { mistakes++; msg.textContent = 'Not this branch. Try another one.'; c.classList.add('no'); setTimeout(() => c.classList.remove('no'), 400); }
    };
    s.append(grid, msg, bank);
  }
  // crossword: Slovenian clues, English answers
  function crossword() {
    const cw = Puzzles.crossword(Puzzles.items(set.words, 3, 10), 10), s = stage();
    if (cw.words.length < 3) { s.append(el('p', 'hint', 'This unit has too few single words for a crossword.')); return; }
    s.append(el('p', 'hint', 'Fill in the English words. The clues are in Slovenian.'));
    const nums = {}; cw.words.forEach(w => { nums[w.r + ',' + w.c] = w.n; });
    const tbl = el('table', 'cw'), inputs = [];
    for (let r = 0; r < cw.rows; r++) { const tr = el('tr'); inputs.push([]); for (let c = 0; c < cw.cols; c++) {
      const td = el('td', cw.cells[r][c] ? '' : 'black'); inputs[r].push(null);
      if (cw.cells[r][c]) {
        const inp = el('input'); inp.maxLength = 1; inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false; inputs[r][c] = inp;
        inp.oninput = () => { inp.value = inp.value.replace(/[^a-z]/gi, '').slice(-1).toLowerCase(); td.className = ''; if (inp.value) { const n = inputs[r][c + 1] || (inputs[r + 1] && inputs[r + 1][c]); if (n) n.focus(); } };
        inp.onfocus = () => inp.select();
        td.append(inp); if (nums[r + ',' + c]) td.append(el('span', 'num', nums[r + ',' + c]));
      }
      tr.append(td); } tbl.append(tr); }
    const cl = el('div', 'clues');
    ['across', 'down'].forEach(d => { const col = el('div'); col.append(el('b', '', d === 'across' ? 'Across →' : 'Down ↓')); const ol = el('ol');
      cw.words.filter(w => w.dir === d).forEach(w => ol.append(el('li', '', w.n + '. ' + clueOf(w.item.w)))); col.append(ol); cl.append(col); });
    const row = el('div', 'row center'), check = el('button', 'btn primary', 'Check'), show2 = el('button', 'btn', 'Show the solution');
    check.onclick = () => {
      let all = true;
      for (let r = 0; r < cw.rows; r++) for (let c = 0; c < cw.cols; c++) if (inputs[r][c]) { const good = inputs[r][c].value.toLowerCase() === cw.cells[r][c]; if (!good) all = false; inputs[r][c].parentNode.className = inputs[r][c].value ? (good ? 'ok' : 'no') : ''; }
      if (all && !revealed) setTimeout(() => puzzleEnd('Crossword solved!', crossword, 'Well done!', 1, 1), 600);   // not saved when the solution was shown
    };
    let revealed = false;
    show2.onclick = () => { revealed = true; for (let r = 0; r < cw.rows; r++) for (let c = 0; c < cw.cols; c++) if (inputs[r][c]) { inputs[r][c].value = cw.cells[r][c]; inputs[r][c].parentNode.className = ''; } };
    row.append(check, show2); row.style.margin = '12px 0';
    s.append(tbl, row, cl);
  }

  // ----- gap fill -----
  function gap() {
    const items = pick(set.sentences, 8, 'gap'); detail = [];
    const s = stage(); s.append(el('p', 'hint', 'Type the missing word, then press Check.'));
    const inputs = [];
    items.forEach(it => {
      const line = el('div', 'gap-line'); const parts = it.text.split('___');
      const inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false;
      line.append(document.createTextNode(parts[0]), inp, document.createTextNode(parts.slice(1).join('___')));
      s.append(line); inputs.push({ it, inp, line });
    });
    const row = el('div', 'row center'); row.style.marginTop = '18px';
    const check = el('button', 'btn primary', 'Check');
    row.append(check); s.append(row);
    let checked = false;
    check.onclick = () => {
      if (checked) { gap(); return; }
      let score = 0;
      inputs.forEach(({ it, inp, line }) => {
        const ok = [it.answer, ...(it.alt || [])].map(norm).includes(norm(inp.value));
        rec(it.text, it.answer, inp.value.trim(), ok);
        inp.classList.add(ok ? 'ok' : 'no'); inp.readOnly = true;
        if (ok) score++; else { line.append(el('span', 'ans', '→ ' + it.answer)); if (explOf(it.text, it.answer)) explBox(it.text, line, it.answer); }
      });
      checked = true; setBar(1);
      const res = el('div', 'result'); res.append(el('div', 'score', `${score} / ${items.length}`));
      report(score, items.length, res);
      const b2 = el('button', 'btn', 'Other activities'); b2.onclick = () => show('menu');
      check.textContent = 'Try again'; row.append(b2); s.insertBefore(res, row);
    };
  }
})();
</script>
</body>
