<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Results</title>
<style>
  :root {
    --bg: #141418; --card: #1f1f26; --ink: #f2efe9; --muted: #a39f95; --line: #34343e; --field: #14141a;
    --accent: #ff8a1f; --accent-ink: #17171c; --accent-soft: #3a2a18; --good: #34c06d; --warn: #f5b301; --bad: #ff5a5a;
    --goodbg: #1d3a2a; --badbg: #4a2424; --radius: 14px;
  }
  body.light {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2a37; --muted: #6b7280; --line: #e5e1d8; --field: #ffffff;
    --accent: #e8710a; --accent-ink: #ffffff; --accent-soft: #fdeedd; --good: #1f9d55; --warn: #e0a100; --bad: #d64545;
    --goodbg: #dcf5e6; --badbg: #fde4e4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0; font-size: 22px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .top .sp { flex: 1; }
  .btn, select, input[type=search] { background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font: inherit; }
  .btn { cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  #login { text-align: center; padding: 40px 14px; }
  #login p { color: var(--muted); }
  #app { display: none; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .filters select { min-width: 130px; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .tabs { display: flex; gap: 6px; margin: 4px 0 12px; flex-wrap: wrap; }
  .tabs .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 26px; line-height: 1.15; color: var(--accent); }
  .tile span { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--card); }
  th.num, td.num { text-align: right; }
  th.on::after { content: " ▼"; color: var(--accent); }
  th.on.asc::after { content: " ▲"; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--accent-soft); }
  .scroll { overflow-x: auto; max-height: 560px; overflow-y: auto; }
  .pct { display: inline-block; min-width: 52px; text-align: center; border-radius: 8px; padding: 1px 6px; }
  .pct.lo { background: var(--badbg); color: var(--bad); }
  .pct.hi { background: var(--goodbg); color: var(--good); }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .msg { color: var(--muted); }
  .msg.err { color: var(--bad); }
  svg text { fill: var(--muted); font-size: 11px; }
  .bar { fill: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  h2 { font-size: 16px; margin: 0 0 8px; }
  .heat { border-collapse: separate; border-spacing: 0; width: auto; }
  .heat th, .heat td { padding: 0; border-bottom: 1px solid var(--line); }
  .heat th { position: static; cursor: default; text-transform: none; letter-spacing: 0; font-size: 12px; background: var(--card); }
  .heat .name { position: sticky; left: 0; background: var(--card); z-index: 1; padding: 4px 10px 4px 4px; white-space: nowrap; cursor: pointer; }
  .heat .name:hover { color: var(--accent); }
  .heat .book { text-align: center; border-left: 2px solid var(--line); padding: 4px 6px; color: var(--accent); }
  .heat .vh { vertical-align: bottom; border-left: 1px solid var(--line); }
  .heat .vh div { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; padding: 6px 2px; max-height: 190px; overflow: hidden; margin: 0 auto; }
  .heat td.c { width: 34px; min-width: 34px; height: 28px; text-align: center; font-size: 12px; border-left: 1px solid var(--line); }
  .heat td.c.lo { background: var(--badbg); color: var(--bad); }
  .heat td.c.mid { background: var(--accent-soft); color: var(--accent); }
  .heat td.c.hi { background: var(--goodbg); color: var(--good); }
  .heat td.c.cnt { background: var(--accent-soft); color: var(--ink); }
  .bar2 { fill: var(--line); }
  .linep { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  .dot { fill: var(--accent); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 0; align-items: center; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .lvl-1 { color: var(--good); } .lvl-2 { color: var(--warn); } .lvl-3 { color: var(--bad); }
  .tools { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
  #printHead { display: none; }
  .report h1 { font-size: 22px; margin: 0 0 2px; }
  .report h2 { margin: 16px 0 6px; }
  .report .sub { color: var(--muted); margin: 0 0 12px; }
  .cm-print { display: none; }
  .cm-edit textarea { width: 100%; background: var(--field); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; resize: vertical; margin-top: 4px; }
  .report .foot { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .report .tag { display: inline-block; padding: 0 7px; border-radius: 8px; font-size: 12px; background: var(--badbg); color: var(--bad); margin-right: 4px; }
  .report .tag.q { background: var(--accent-soft); color: var(--accent); }
  @media print {
    @page { size: A4 landscape; margin: 12mm; }
    body, body.light { --bg: #fff; --card: #fff; --ink: #111; --muted: #555; --line: #ccc; --field: #fff; --accent: #c25a00; --accent-soft: #fde8d0;
      --good: #13703a; --warn: #946c00; --bad: #b32020; --goodbg: #d6f0df; --badbg: #fbdcdc; }
    body { background: #fff; font-size: 12px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .wrap { max-width: none; padding: 0; }
    .top .btn, .top #who, #login, .filters, .tabs, .tools, #reload, #theme, .no-print { display: none !important; }
    #printHead { display: block; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
    .scroll { max-height: none !important; overflow: visible !important; }
    .card { break-inside: auto; border: 1px solid #ccc; padding: 8px; margin-bottom: 8px; }
    th { position: static; }
    tr { break-inside: avoid; }
    .heat .name { position: static; }
    body.print-one #view > .card:not(.one) { display: none; }
    body.rep #printHead, body.rep .top { display: none !important; }
    @page report { size: A4 portrait; margin: 12mm; }
    .report { page: report; }
    .report .card { border: none; padding: 0; }
    .report h2 { break-after: avoid; }
    .report .cm-edit { display: none !important; }
    .report .cm-print { display: block; white-space: pre-wrap; border-left: 3px solid var(--accent); padding: 4px 10px; margin: 8px 0 12px; }
    .report .cm-print:empty { display: none; }
    .report .heat { font-size: 10.5px; }
    .report .heat td.c { width: 24px; min-width: 24px; height: 22px; font-size: 10.5px; }
    .report .heat .name { padding: 2px 8px 2px 2px; }
    .report .heat .vh div { max-height: 170px; font-size: 10px; }
    .report .heat tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Results</h1>
    <span class="sp"></span>
    <span class="muted" id="who"></span>
    <button class="btn" id="reload" style="display:none">Reload data</button>
    <button class="btn" id="theme">Light / dark</button>
  </div>

  <div id="login" class="card">
    <p id="loginMsg">Sign in with your school Google account to see the results. Only the teacher account is allowed.</p>
    <div id="slot"></div>
  </div>

  <div id="app">
    <div class="card filters">
      <label>School year <select id="fYear"></select></label>
      <label>Class <select id="fClass"></select></label>`n      <label>+ second class <select id="fClass2"></select></label>
      <label>Accounts <select id="fWho"><option value="p">Pupils (with a class)</option><option value="n">No class (teachers, unlisted)</option><option value="all">Everyone</option></select></label>
      <label>Book <select id="fBook"></select></label>
      <label>Level <select id="fLevel"></select></label>
      <label>From <input type="date" id="fFrom" class="btn"></label>
      <label>To <input type="date" id="fTo" class="btn"></label>
      <button class="btn" id="fReset">Reset</button>
    </div>
    <p class="muted no-print" id="whoNote" style="margin:-4px 0 8px;font-size:12px"></p>
    <div class="tabs" id="tabs"></div>
    <div class="tools"><button class="btn" id="bCsv">Download table (CSV)</button><button class="btn" id="bRaw">Download all filtered results (CSV)</button><button class="btn" id="bPrint">Print</button></div>
    <div id="printHead"></div>
    <div id="view"></div>
  </div>
</div>

<script src="../exercises/tracking.js"></script>
<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const BOOKS = { '6b': 'Project 1', '7a': 'Dream Team Starter', '7bc': 'Project 2', '8a': 'Dream Team 1', '8b': 'Project 3', '9a': 'Dream Team 2', '9b': 'Project 4', 'extra': 'Extra practice' };
  const LEVELS = { 1: '1 Easy', 2: '2 Medium', 3: '3 Hard' };
  const pct = x => Math.round(x * 100) + ' %';
  const fmtDate = t => t ? new Date(t).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
  const fmtTime = t => t ? new Date(t).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const badge = v => { const s = el('span', 'pct' + (v < 0.6 ? ' lo' : v >= 0.9 ? ' hi' : ''), pct(v)); return s; };
  const avg = (a, f) => a.length ? a.reduce((s, x) => s + f(x), 0) / a.length : 0;

  let rows = [], roster = [], tab = 'overview', sortKey = {}, selPupil = '';
  const F = { year: '', cls: '', cls2: '', who: 'p', book: '', level: '', from: '', to: '' };
  // accounts filter: pupils = accounts with a class in the Roster; a chosen class always means pupils
  // one or two classes (lessons with combined classes): the second one only counts when a first one is chosen
  const clsOk = c => !F.cls || c === F.cls || (!!F.cls2 && c === F.cls2);
  const clsText = cap => F.cls ? (cap ? 'Class ' : 'class ') + F.cls + (F.cls2 ? ' + ' + F.cls2 : '') : (cap ? 'All classes' : 'all classes');
  const whoOk = c => !!F.cls || F.who === 'all' || (F.who === 'n' ? !c : !!c);

  // ---------------------------------------------------------------- data
  const load = async () => {
    const token = Track.token(); if (!token) return;
    $('#loginMsg').textContent = 'Loading the results…'; $('#login').style.display = 'block';
    try {
      const r = await fetch(Track.config.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'stats', token }) });
      const j = await r.json();
      if (!j.ok) {
        $('#loginMsg').textContent = j.error === 'token' ? 'This Google account is not allowed to see the results.' : 'Could not load the results.';
        $('#loginMsg').className = 'msg err'; return;
      }
      rows = j.rows.map(a => ({ t: a[0], last: a[1], first: a[2], cls: a[3] || '', book: a[4], unit: a[5], act: a[6],
                                lvl: a[7], score: a[8], total: a[9], year: a[10], p: a[9] ? a[8] / a[9] : 0, key: a[1] + '|' + a[2] }));
      roster = j.roster.map(a => ({ year: a[0], cls: a[1], name: a[2], n: a[3], last: a[4] }));
      $('#login').style.display = 'none'; $('#app').style.display = 'block'; $('#reload').style.display = '';
      $('#who').textContent = 'Signed in as ' + (Track.email || '');
      setupFilters(); render();
    } catch (e) { $('#loginMsg').textContent = 'Could not reach the Sheet. Check your connection.'; $('#loginMsg').className = 'msg err'; }
  };

  const fill = (sel, items, label) => {
    const cur = sel.value; sel.innerHTML = '';
    items.forEach(([v, t]) => { const o = el('option', '', t); o.value = v; sel.append(o); });
    sel.value = items.some(i => i[0] === cur) ? cur : items[0][0];
  };
  let classList = [];
  // the second class is only offered once a first class is chosen (and never the same one)
  const syncCls2 = () => {
    if (!F.cls || F.cls2 === F.cls) F.cls2 = '';
    const s = $('#fClass2'); s.innerHTML = '';
    [['', '— none —']].concat(classList.filter(c => c !== F.cls).map(c => [c, c])).forEach(([v, x]) => { const o = document.createElement('option'); o.value = v; o.textContent = x; s.append(o); });
    s.value = F.cls2; s.disabled = !F.cls;
  };
  const setupFilters = () => {
    const years = [...new Set(rows.map(r => r.year).concat(roster.map(r => r.year)))].filter(Boolean).sort().reverse();
    if (!F.year || !years.includes(F.year)) F.year = years[0] || '';
    fill($('#fYear'), [['', 'All years']].concat(years.map(y => [y, y])));
    $('#fYear').value = F.year;
    const classes = [...new Set(rows.map(r => r.cls).concat(roster.map(r => r.cls)))].filter(Boolean).sort((a, b) => a.localeCompare(b, 'sl', { numeric: true }));
    fill($('#fClass'), [['', 'All classes']].concat(classes.map(c => [c, c])));
    classList = classes; syncCls2();
    const books = [...new Set(rows.map(r => r.book))].filter(Boolean).sort();
    fill($('#fBook'), [['', 'All books']].concat(books.map(b => [b, (BOOKS[b] || b) + ' (' + b + ')'])));
    fill($('#fLevel'), [['', 'All levels'], ['1', LEVELS[1]], ['2', LEVELS[2]], ['3', LEVELS[3]]]);
  };
  ['fYear:year', 'fClass:cls', 'fClass2:cls2', 'fWho:who', 'fBook:book', 'fLevel:level', 'fFrom:from', 'fTo:to'].forEach(p => {
    const [id, k] = p.split(':'); $('#' + id).onchange = e => { F[k] = e.target.value; if (k === 'cls') syncCls2(); selPupil = ''; render(); };
  });
  $('#fReset').onclick = () => { F.cls = F.cls2 = F.book = F.level = F.from = F.to = ''; F.who = 'p'; $('#fWho').value = 'p'; $('#fFrom').value = $('#fTo').value = ''; setupFilters(); selPupil = ''; render(); };

  const filtered = (allClasses) => {
    const from = F.from ? new Date(F.from + 'T00:00:00').getTime() : 0, to = F.to ? new Date(F.to + 'T23:59:59').getTime() : Infinity;
    return rows.filter(r => (!F.year || r.year === F.year) && (allClasses ? !!r.cls : clsOk(r.cls) && whoOk(r.cls)) && (!F.book || r.book === F.book) &&
      (!F.level || String(r.lvl) === F.level) && r.t >= from && r.t <= to);
  };

  // ---------------------------------------------------------------- tabs
  const TABS = [['overview', 'Overview'], ['report', 'Class report'], ['homework', 'Homework'], ['heat', 'Heat-map'], ['weak', 'Weak spots'], ['questions', 'Questions'], ['progress', 'Progress'], ['compare', 'Compare classes'], ['pupils', 'Pupils'], ['units', 'Units'], ['quiet', 'Not practising']];
  const render = () => {
    const tabs = $('#tabs'); tabs.innerHTML = '';
    TABS.forEach(([id, name]) => { const b = el('button', 'btn' + (id === tab ? ' on' : ''), name); b.onclick = () => { tab = id; render(); }; tabs.append(b); });
    document.body.classList.toggle('rep', tab === 'report');
    const view = $('#view'); view.innerHTML = '';
    $('#printHead').textContent = 'Results · ' + [clsText(), F.book ? (BOOKS[F.book] || F.book) : 'all books', F.level ? LEVELS[F.level] : '', F.year || 'all years',
      F.from || F.to ? (F.from || '…') + ' – ' + (F.to || '…') : ''].filter(Boolean).join(' · ') + ' · ' + (TABS.find(x => x[0] === tab) || [0, ''])[1] + ' · printed ' + new Date().toLocaleDateString('en-GB');
    const data = filtered();
    const hidden = F.cls || F.who === 'all' ? 0 : rows.filter(r => (!F.year || r.year === F.year) && !whoOk(r.cls)).length;
    $('#whoNote').textContent = hidden ? hidden + (hidden === 1 ? ' result from ' : ' results from ') + (F.who === 'n' ? 'accounts with a class' : 'accounts without a class (teachers, or pupils missing from the Roster)') + ' are not shown. Change "Accounts" to see them.' : '';
    if (tab === 'compare') { compare(view, filtered(true)); return; }
    if (tab === 'homework') { homework(view); return; }
    if (tab === 'overview') overview(view, data); else if (tab === 'report') report(view, data); else if (tab === 'heat') heat(view, data); else if (tab === 'weak') weak(view, data); else if (tab === 'questions') questions(view); else if (tab === 'progress') progress(view, data);
    else if (tab === 'pupils') pupils(view, data);
    else if (tab === 'units') units(view, data); else quiet(view);
  };

  const tile = (v, label) => { const t = el('div', 'tile'); t.append(el('b', '', v), el('span', '', label)); return t; };

  // sortable table: cols = [{h, k (sort value), v (cell builder), num}]
  const table = (id, cols, items, defKey, onRow) => {
    const st = sortKey[id] || (sortKey[id] = { k: defKey, asc: ['Level', 'Class', 'Pupil', 'Average'].includes(defKey) });
    const col = cols.find(c => c.h === st.k) || cols[0];
    const sorted = items.slice().sort((a, b) => {
      const x = col.k(a), y = col.k(b);
      const c = typeof x === 'string' ? x.localeCompare(y, 'sl') : x - y; return st.asc ? c : -c;
    });
    const wrap = el('div', 'scroll'), tb = el('table'), thead = el('thead'), hr = el('tr');
    cols.forEach(c => {
      const th = el('th', (c.num ? 'num ' : '') + (c.h === st.k ? 'on' + (st.asc ? ' asc' : '') : ''), c.h);
      th.onclick = () => { st.asc = st.k === c.h ? !st.asc : (typeof c.k(items[0] || {}) === 'string'); st.k = c.h; render(); };
      hr.append(th);
    });
    thead.append(hr); tb.append(thead);
    const body = el('tbody');
    sorted.forEach(it => {
      const tr = el('tr', onRow ? 'click' : '');
      cols.forEach(c => { const td = el('td', c.num ? 'num' : ''); const v = c.v(it); if (v instanceof Node) td.append(v); else td.textContent = v; tr.append(td); });
      if (onRow) tr.onclick = () => onRow(it);
      body.append(tr);
    });
    tb.append(body); wrap.append(tb); return wrap;
  };

  // ---------------------------------------------------------------- overview
  const overview = (view, data) => {
    const names = new Set(data.map(r => r.key));
    const tiles = el('div', 'tiles');
    tiles.append(tile(data.length, 'finished activities'), tile(data.reduce((s, r) => s + r.total, 0), 'questions answered'),
      tile(names.size, 'pupils practising'), tile(data.length ? pct(avg(data, r => r.p)) : '—', 'average result'),
      tile(data.filter(r => r.lvl === 3).length, 'hard tests (Unit test 2)'));
    const c1 = el('div', 'card'); c1.append(tiles); view.append(c1);

    // activity per day
    const c2 = el('div', 'card'); c2.append(el('h2', '', 'Activity per day'));
    const days = {}; data.forEach(r => { const k = dayKey(r.t); days[k] = (days[k] || 0) + 1; });
    const keys = Object.keys(days).sort();
    if (!keys.length) c2.append(el('p', 'msg', 'No results for this selection.'));
    else {
      const first = new Date(keys[0] + 'T00:00:00'), last = new Date(keys[keys.length - 1] + 'T00:00:00'), list = [];
      for (let d = new Date(first); d <= last && list.length < 400; d.setDate(d.getDate() + 1)) list.push(dayKey(d));
      const max = Math.max(...Object.values(days)), W = 1040, H = 150, bw = Math.max(2, Math.min(24, (W - 40) / list.length - 2));
      let svg = `<svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Activity per day">`;
      list.forEach((k, i) => {
        const v = days[k] || 0, h = v / max * H, x = 30 + i * ((W - 40) / list.length);
        svg += `<rect class="bar" x="${x.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2"><title>${k}: ${v}</title></rect>`;
        if (list.length <= 31 || i % Math.ceil(list.length / 12) === 0) svg += `<text x="${x.toFixed(1)}" y="${H + 14}">${k.slice(8)}.${k.slice(5, 7)}.</text>`;
      });
      svg += `<text x="0" y="10">${max}</text><text x="0" y="${H}">0</text></svg>`;
      const holder = el('div'); holder.innerHTML = svg; c2.append(holder);
    }
    view.append(c2);

    const g = el('div', 'grid2');
    // by level
    const c3 = el('div', 'card'); c3.append(el('h2', '', 'By difficulty'));

    ov.append(lg); view.append(ov);

    // --- every pupil across the assignments shown
    const pm = hwByPupil(sums), plist = [...pm.values()];
    const pc = el('div', 'card'); pc.append(el('h2', '', 'Pupils across all this homework'));
    pc.append(el('p', 'note', 'Done % = done (on time or late) of everything assigned. “Often missing” = two or more missing.'));
    pc.append(table('hwp', [
      { h: 'Pupil', k: x => x.name, v: x => x.name },
      { h: 'Class', k: x => x.cls, v: x => x.cls },
      { h: 'Assigned', k: x => x.assigned, v: x => x.assigned, num: true },
      { h: 'On time', k: x => x.onTime, v: x => x.onTime, num: true },
      { h: 'Late', k: x => x.late, v: x => x.late, num: true },
      { h: 'Missing', k: x => x.missing, v: x => x.missing, num: true },
      { h: 'Open', k: x => x.open, v: x => x.open, num: true },
      { h: 'Done %', k: x => (x.onTime + x.late) / x.assigned, v: x => badge((x.onTime + x.late) / x.assigned), num: true },
      { h: 'Avg best score', k: x => x.scoreN ? x.scoreSum / x.scoreN : -1, v: x => x.scoreN ? badge(x.scoreSum / x.scoreN) : '—', num: true },
      { h: 'Note', k: x => x.missing, v: x => x.missing >= 2 ? el('span', 'pct lo', 'often missing') : '' }], plist, 'Missing'));
    view.append(pc);

    // --- one card per assignment
    sums.forEach(s => {
      const it = s.it, card = el('div', 'card'), pup = s.pup;
      const names = it.acts.map(id => (HW_ACTS.find(a => a[0] === id) || [0, id])[1]);
      card.append(el('h2', '', (BOOKS[it.book] || it.book) + ' · ' + [it.unit, it.topic].filter(Boolean).join(' · ')));
      card.append(el('p', 'note', 'Class ' + it.cls + (it.all ? ' (whole class)' : ' (' + pup.length + ' chosen pupils)') + ' · ' + names.join(', ') + (it.min ? ' · at least ' + it.min + ' %' : '') +
        ' · due ' + fmtDate(it.dueEnd || 0) + ' · assigned ' + fmtDate(it.created) + (it.note ? ' · “' + it.note + '”' : '')));
      const tiles2 = el('div', 'tiles'); tiles2.append(tile((s.onTime + s.late) + ' / ' + s.n, 'done' + (s.late ? ' (' + s.late + ' late)' : '')), tile(s.missing, 'missing'), tile(s.open, 'open'),
        tile(s.avgScore == null ? '—' : pct(s.avgScore), 'average best score'), tile(s.med == null ? '—' : (s.med < 1 ? 'same day' : s.med.toFixed(1) + ' days'), 'typical time to finish'));
      card.append(tiles2);
      const an = names.map((n, i) => n + ': ' + (s.actAvg[i] == null ? '—' : pct(s.actAvg[i]))).join(' · ');
      card.append(el('p', 'note', 'Average best score per activity (pupils who tried it) — ' + an));
      if (pup.length) {
        const cols = [{ h: 'Pupil', k: x => x.name, v: x => x.name }];
        names.forEach((n, i) => cols.push({ h: n, k: x => x.per[i] == null ? -1 : x.per[i], num: true, v: x => x.per[i] == null ? '—' : (x.ok[i] ? '✓ ' : '') + pct(x.per[i]) }));
        cols.push({ h: 'Finished', k: x => x.doneAt || 0, num: true, v: x => x.doneAt ? fmtDate(x.doneAt) : '—' });
        const rank = { Missing: 0, 'Not done': 1, 'In progress': 2, 'Done late': 3, Done: 4 };
        cols.push({ h: 'Status', k: x => rank[x.status], v: x => el('span', 'pct' + (x.status === 'Done' ? ' hi' : x.status === 'Missing' || x.status === 'Not done' ? ' lo' : ''), x.status) });
        card.append(table('hw' + it.id, cols, pup, 'Status'));
      }
      const row = el('div', 'tools'); row.style.marginTop = '10px';
      const todo = pup.filter(p => !p.doneAt).map(p => p.name);
      if (todo.length) { const cp = el('button', 'btn no-print', 'Copy names of pupils who have not finished (' + todo.length + ')'); cp.onclick = () => { navigator.clipboard.writeText(todo.join('\n')).then(() => { cp.textContent = 'Copied ✓'; }, () => { cp.textContent = todo.join(', '); }); }; row.append(cp); }
      const del = el('button', 'btn no-print', 'Delete this homework'); del.onclick = async () => {
        if (!confirm('Delete this homework? Pupils will no longer see it (results are not affected).')) return;
        try { const j = await api('hwdelete', { id: it.id }); if (!j.ok) throw 0; hwState = ''; hwData = null; render(); } catch (e) { del.textContent = 'Could not delete'; }
      };
      row.append(del); card.append(row); view.append(card);
    });
  };
  // ---------------------------------------------------------------- compare classes (weekly lines, one per class)
  const COLORS = ['#e8710a', '#2b8a3e', '#1c7ed6', '#ae3ec9', '#c92a2a', '#0c8599', '#e6a700', '#5c940d', '#d6336c', '#7048e8'];
  const compare = (view, data) => {
    const classes = [...new Set(data.map(r => r.cls))].sort((a, b) => a.localeCompare(b, 'sl', { numeric: true }));
    const card = el('div', 'card');
    card.append(el('p', 'note', 'All classes side by side (the Class filter is ignored; year, book, level and dates apply). “Per pupil” divides by the number of pupils in the class in the Roster, so large and small classes can be compared fairly.'));
    if (!classes.length) { card.append(el('p', 'msg', 'No results for this selection.')); view.append(card); return; }
    const size = c => roster.filter(r => (!F.year || r.year === F.year) && r.cls === c).length;
    const stat = classes.map(c => {
      const a = data.filter(r => r.cls === c), pupilsN = new Set(a.map(r => r.key)).size, sz = size(c) || pupilsN;
      return { cls: c, size: sz, active: pupilsN, n: a.length, per: a.length / sz, q: a.reduce((s, r) => s + r.total, 0), p: avg(a, r => r.p),
               hard: a.length ? a.filter(r => r.lvl === 3).length / a.length : 0, last: a.reduce((m, r) => r.t > m ? r.t : m, 0), rows: a };
    });
    const sel = el('select'); [['p', 'Average result'], ['n', 'Activities per pupil']].forEach(([v, t]) => { const o = el('option', '', t); o.value = v; sel.append(o); });
    const top = el('div'); top.style.marginBottom = '8px'; top.append(el('span', 'muted', 'Chart: '), sel);
    const chartBox = el('div');
    const draw = () => {
      chartBox.innerHTML = '';
      const metric = sel.value;
      const all = data.map(r => weekStart(r.t)), w0 = Math.min(...all), w1 = Math.max(...all), list = [];
      for (let w = w0; w <= w1 && list.length < 200; ) { list.push(w); const n = new Date(w); n.setDate(n.getDate() + 7); w = n.getTime(); }
      const val = {}; let maxV = metric === 'p' ? 1 : 0.0001;
      stat.forEach(s => { const wk = {}; s.rows.forEach(r => { const k = weekStart(r.t); const o = wk[k] = wk[k] || { n: 0, s: 0 }; o.n++; o.s += r.p; });
        val[s.cls] = {}; Object.keys(wk).forEach(k => { const v = metric === 'p' ? wk[k].s / wk[k].n : wk[k].n / s.size; val[s.cls][k] = v; if (v > maxV) maxV = v; }); });
      const W = 1040, H = 220, L = 44, step = (W - L - 10) / Math.max(list.length, 1);
      let svg = `<svg viewBox="0 -10 ${W} ${H + 40}" width="100%" role="img" aria-label="Class comparison per week">`;
      [0, 0.5, 1].forEach(v => { const y = H - v * H; svg += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="0" y="${y + 4}">${metric === 'p' ? v * 100 + ' %' : (v * maxV).toFixed(1)}</text>`; });
      list.forEach((w, i) => { if (list.length <= 20 || i % Math.ceil(list.length / 14) === 0) { const dd = new Date(w), x = L + i * step + step / 2; svg += `<text x="${(x - 14).toFixed(1)}" y="${H + 16}">${String(dd.getDate()).padStart(2, '0')}.${String(dd.getMonth() + 1).padStart(2, '0')}.</text>`; } });
      stat.forEach((s, ci) => {
        const col = COLORS[ci % COLORS.length], pts = [];
        list.forEach((w, i) => { const v = val[s.cls][w]; if (v != null) pts.push([L + i * step + step / 2, H - v / maxV * H, v, w]); });
        s.col = col;
        svg += `<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
        pts.forEach(p => { svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${col}"><title>${s.cls}, week of ${fmtDate(p[3])}: ${metric === 'p' ? pct(p[2]) : p[2].toFixed(2) + ' activities per pupil'}</title></circle>`; });
      });
      svg += '</svg>';
      const ch = el('div'); ch.innerHTML = svg; chartBox.append(ch);
      const lg = el('div', 'legend');
      stat.forEach(s => { const sp = el('span'); const sw = el('i', 'sw'); sw.style.background = s.col; sp.append(sw, s.cls); lg.append(sp); });
      lg.append(el('span', '', 'weeks start on Monday'));
      chartBox.append(lg);
    };
    sel.onchange = draw;
    card.append(top, chartBox); view.append(card); draw();
    const c2 = el('div', 'card'); c2.append(el('h2', '', 'Classes in numbers'));
    c2.append(table('cmp', [
      { h: 'Class', k: x => x.cls, v: x => x.cls },
      { h: 'Pupils', k: x => x.size, v: x => x.size, num: true },
      { h: 'Practising', k: x => x.active / x.size, v: x => x.active + ' (' + pct(x.active / x.size) + ')', num: true },
      { h: 'Activities', k: x => x.n, v: x => x.n, num: true },
      { h: 'Per pupil', k: x => x.per, v: x => x.per.toFixed(1), num: true },
      { h: 'Questions', k: x => x.q, v: x => x.q, num: true },
      { h: 'Average', k: x => x.p, v: x => badge(x.p), num: true },
      { h: 'Hard tests', k: x => x.hard, v: x => pct(x.hard), num: true },
      { h: 'Last activity', k: x => x.last, v: x => fmtDate(x.last), num: true }], stat, 'Per pupil'));
    view.append(c2);
  };
  // ---------------------------------------------------------------- pupils
  const pupils =(view, data) => {
    const by = {}; data.forEach(r => (by[r.key] = by[r.key] || []).push(r));
    const list = Object.keys(by).map(k => { const a = by[k], last = a.reduce((m, r) => r.t > m ? r.t : m, 0);
      return { key: k, name: a[0].last + ' ' + a[0].first, cls: [...new Set(a.map(r => r.cls).filter(Boolean))].join(', '),
               n: a.length, q: a.reduce((s, r) => s + r.total, 0), p: avg(a, r => r.p), lv: avg(a, r => r.lvl),
               hard: a.filter(r => r.lvl === 3).length, last, rows: a }; });
    const card = el('div', 'card');
    const s = el('input'); s.type = 'search'; s.placeholder = 'Find a pupil…'; s.style.marginBottom = '8px';
    const holder = el('div');
    const draw = () => {
      holder.innerHTML = '';
      const q = s.value.trim().toLowerCase();
      const items = list.filter(x => !q || x.name.toLowerCase().includes(q));
      holder.append(table('pupils', [
        { h: 'Pupil', k: x => x.name, v: x => x.name },
        { h: 'Class', k: x => x.cls, v: x => x.cls },
        { h: 'Activities', k: x => x.n, v: x => x.n, num: true },
        { h: 'Questions', k: x => x.q, v: x => x.q, num: true },
        { h: 'Average', k: x => x.p, v: x => badge(x.p), num: true },
        { h: 'Avg level', k: x => x.lv, v: x => x.lv.toFixed(1), num: true },
        { h: 'Hard tests', k: x => x.hard, v: x => x.hard, num: true },
        { h: 'Last practised', k: x => x.last, v: x => fmtDate(x.last), num: true }], items, 'Activities', x => { selPupil = x.key; render(); }));
    };
    s.oninput = draw;
    card.append(el('p', 'note', list.length + ' pupils. Click a column to sort, click a pupil for the details.'), s, holder);
    view.append(card); draw();
    if (selPupil && by[selPupil]) pupilDetail(view, list.find(x => x.key === selPupil));
  };

  const pupilDetail = (view, p) => {
    const card = el('div', 'card'); card.append(el('h2', '', p.name + (p.cls ? ' · ' + p.cls : '')));
    card.classList.add('one');
    const pr = el('button', 'btn no-print', 'Print this pupil'); pr.style.cssText = 'margin:0 8px 10px 0'; pr.onclick = () => printPage(true); card.append(pr);
    const go = el('button', 'btn no-print', 'Show progress over time'); go.style.marginBottom = '10px'; go.onclick = () => { tab = 'progress'; render(); }; card.append(go);
    const tiles = el('div', 'tiles');
    tiles.append(tile(p.n, 'activities'), tile(p.q, 'questions'), tile(pct(p.p), 'average'), tile(p.lv.toFixed(1), 'avg level'), tile(p.hard, 'hard tests'));
    card.append(tiles);
    const byUnit = {}; p.rows.forEach(r => (byUnit[r.unit] = byUnit[r.unit] || []).push(r));
    const ul = Object.keys(byUnit).map(u => ({ u, n: byUnit[u].length, best: Math.max(...byUnit[u].map(r => r.p)), p: avg(byUnit[u], r => r.p), last: Math.max(...byUnit[u].map(r => r.t)) }));
    const h = el('h2', '', 'Units'); h.style.marginTop = '14px'; card.append(h);
    card.append(table('pu', [
      { h: 'Unit', k: x => x.u, v: x => x.u },
      { h: 'Activities', k: x => x.n, v: x => x.n, num: true },
      { h: 'Best', k: x => x.best, v: x => badge(x.best), num: true },
      { h: 'Average', k: x => x.p, v: x => badge(x.p), num: true },
      { h: 'Last', k: x => x.last, v: x => fmtDate(x.last), num: true }], ul, 'Last'));
    const h2 = el('h2', '', 'Latest activities'); h2.style.marginTop = '14px'; card.append(h2);
    card.append(table('pl', [
      { h: 'When', k: x => x.t, v: x => fmtTime(x.t) },
      { h: 'Unit', k: x => x.unit, v: x => x.unit },
      { h: 'Activity', k: x => x.act, v: x => x.act },
      { h: 'Level', k: x => x.lvl, v: x => { const s = el('span', 'lvl-' + x.lvl, LEVELS[x.lvl] || x.lvl); return s; } },
      { h: 'Score', k: x => x.p, v: x => x.score + ' / ' + x.total + '  ', num: true },
      { h: '%', k: x => x.p, v: x => badge(x.p), num: true }], p.rows.slice().sort((a, b) => b.t - a.t).slice(0, 25), 'When'));
    view.append(card); card.scrollIntoView({ block: 'nearest' });
  };

  // ---------------------------------------------------------------- units
  const units = (view, data) => {
    const by = {}; data.forEach(r => (by[r.unit || '(no unit)'] = by[r.unit || '(no unit)'] || []).push(r));
    const list = Object.keys(by).map(u => ({ u, n: by[u].length, pupils: new Set(by[u].map(r => r.key)).size, p: avg(by[u], r => r.p),
                                            q: by[u].reduce((s, r) => s + r.total, 0) }));
    const card = el('div', 'card');
    card.append(el('p', 'note', 'Units with a low average need more practice. Sort by "Average" (click twice for lowest first).'));
    card.append(table('units', [
      { h: 'Unit', k: x => x.u, v: x => x.u },
      { h: 'Pupils', k: x => x.pupils, v: x => x.pupils, num: true },
      { h: 'Activities', k: x => x.n, v: x => x.n, num: true },
      { h: 'Questions', k: x => x.q, v: x => x.q, num: true },
      { h: 'Average', k: x => x.p, v: x => badge(x.p), num: true }], list, 'Activities'));
    view.append(card);
  };

  // ---------------------------------------------------------------- not practising
  const quiet = view => {
    const card = el('div', 'card');
    const row = el('div'); row.style.marginBottom = '8px';
    const sel = el('select'); [['0', 'never practised'], ['7', 'nothing in the last 7 days'], ['14', 'nothing in the last 14 days'], ['30', 'nothing in the last 30 days']]
      .forEach(([v, t]) => { const o = el('option', '', t); o.value = v; sel.append(o); });
    sel.value = sortKey.quietDays || '14'; row.append(el('span', 'muted', 'Show pupils with: '), sel);
    const holder = el('div');
    const draw = () => {
      sortKey.quietDays = sel.value; holder.innerHTML = '';
      const days = Number(sel.value), cutoff = Date.now() - days * 86400000;
      const year = F.year || roster.map(r => r.year).sort().pop();
      const items = roster.filter(r => r.year === year && clsOk(r.cls) && (days === 0 ? r.n === 0 : (r.n === 0 || r.last < cutoff)));
      holder.append(el('p', 'note', items.length + ' of ' + roster.filter(r => r.year === year && clsOk(r.cls)).length + ' pupils in the Roster (' + year + ').'));
      holder.append(table('quiet', [
        { h: 'Pupil', k: x => x.name, v: x => x.name },
        { h: 'Class', k: x => x.cls, v: x => x.cls },
        { h: 'Activities this year', k: x => x.n, v: x => x.n, num: true },
        { h: 'Last practised', k: x => x.last, v: x => fmtDate(x.last), num: true }], items, 'Pupil'));
    };
    sel.onchange = draw; card.append(row, holder); view.append(card); draw();
    view.append(Object.assign(el('p', 'note', 'Pupils are matched to the Roster by e-mail or name. The Book, Level and date filters do not apply here.')));
  };

  // ---------------------------------------------------------------- export and print
  const csvCell = s => '"' + String(s == null ? '' : s).replace(/"/g, '""').replace(/\s+/g, ' ').trim() + '"';
  const download = (name, text) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' })); a.download = name;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  const stamp = () => new Date().toISOString().slice(0, 10);
  const exportTable = () => {
    const tables = [...$('#view').querySelectorAll('table')];
    if (!tables.length) { alert('There is no table to download on this tab.'); return; }
    const out = [csvCell($('#printHead').textContent)];
    tables.forEach(tb => {
      const h = tb.closest('.card') && tb.closest('.card').querySelector('h2'); out.push(''); if (h) out.push(csvCell(h.textContent));
      if (tb.classList.contains('heat')) {
        out.push(['Pupil'].concat([...tb.querySelectorAll('thead tr:nth-child(2) th.vh')].map(th => th.title)).map(csvCell).join(';'));
        tb.querySelectorAll('tbody tr').forEach(tr => out.push([...tr.children].map(td => csvCell(td.textContent)).join(';')));
      } else tb.querySelectorAll('tr').forEach(tr => out.push([...tr.children].map(c => csvCell(c.textContent)).join(';')));
    });
    download('results-' + tab + '-' + stamp() + '.csv', out.join('\r\n'));
  };
  const exportRaw = () => {
    const d = filtered().slice().sort((a, b) => a.t - b.t);
    const out = [['Date and time', 'Last name', 'First name', 'Class', 'Book', 'Unit', 'Activity', 'Level', 'Score', 'Total', 'Result %', 'School year'].map(csvCell).join(';')];
    d.forEach(r => out.push([new Date(r.t).toLocaleString('sv-SE'), r.last, r.first, r.cls, BOOKS[r.book] || r.book, r.unit, r.act, r.lvl, r.score, r.total, Math.round(r.p * 100), r.year].map(csvCell).join(';')));
    download('results-all-' + stamp() + '.csv', out.join('\r\n'));
  };
  const printPage = one => {
    document.body.classList.toggle('print-one', !!one);
    const done = () => { document.body.classList.remove('print-one'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); setTimeout(() => window.print(), 50);
  };
  $('#bCsv').onclick = exportTable; $('#bRaw').onclick = exportRaw; $('#bPrint').onclick = () => printPage(false);

  // ---------------------------------------------------------------- start  $('#theme').onclick = () => { document.body.classList.toggle('light'); try { localStorage.setItem('res.light', document.body.classList.contains('light') ? '1' : ''); } catch (e) {} };
  try { if (localStorage.getItem('res.light')) document.body.classList.add('light'); } catch (e) {}
  $('#reload').onclick = load;
  if (window.Track && Track.enabled) {
    Track.onChange(() => { if (Track.token()) load(); });
    Track.init(() => { if (Track.token()) load(); else Track.button($('#slot')); });
  } else $('#loginMsg').textContent = 'Sign-in is not set up.';
})();
</script>
</body>
</html>
