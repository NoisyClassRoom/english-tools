<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kako se učimo – predstavitev za zbor</title>
<style>
/* Presentation of the questionnaire results for the teachers' meeting (decision of the teacher, 17 Nov 2026): web slides drawn live from
   action rsresults, so new answers, the spring round (končno) and later the grades appear without rebuilding. Role skupina only.
   Aggregates only: the page never shows a name (the server sends names to the team, this page ignores them). Classes are shown
   from 3 answers on (the teacher's decision for this page; team/rezultati/ keeps 5). Codes and labels: ../vprasalnik.js.
   Keys: ← → space PageUp PageDown Home End, F = full screen. Print = one slide per landscape page. Light theme by default
   (projector); colours as in team/rezultati/: rounds = orange (začetno) / blue (končno), heat map = one blue ramp. */
body {
  --bg: #f6f4ef; --card: #ffffff; --ink: #1f2a37; --muted: #6b7280; --line: #e5e1d8; --accent: #e8710a;
  --spring: #2a78d6; --autumn: #eb6834; --up: #0a8a0a; --down: #d03b3b;
  --o1: #86b6ef; --o3: #2a78d6; --o4: #184f95;
  --h0: #f3f2ee; --h1: #cde2fb; --h2: #9ec5f4; --h3: #6da7ec; --h4: #3987e5; --h5: #1c5cab;
}
body.dark {
  --bg: #141418; --card: #1f1f26; --ink: #f2efe9; --muted: #a39f95; --line: #34343e; --accent: #ff8a1f;
  --spring: #3987e5; --autumn: #d95926; --up: #0ca30c; --down: #e66767;
  --o1: #184f95; --o3: #5598e7; --o4: #9ec5f4;
  --h0: #26262e; --h1: #104281; --h2: #1c5cab; --h3: #2a78d6; --h4: #5598e7; --h5: #9ec5f4;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
.muted { color: var(--muted); }
#login { max-width: 560px; margin: 12vh auto; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px 16px; }
#login a { color: var(--accent); }
/* slides: 16:9 stage, font sizes in units of the stage */
#deck { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; }
.slide { display: none; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); padding: 4.2% 5.5% 5.5%; background: var(--bg); flex-direction: column; position: relative; font-size: min(1.6vw, 2.85vh); }
.slide.on { display: flex; }
.slide h1 { font-size: 3.4em; line-height: 1.1; margin: 0 0 .3em; }
.slide h2 { font-size: 2.1em; margin: 0 0 .15em; }
.slide .sub { font-size: 1.05em; color: var(--muted); margin: 0 0 1.1em; }
.slide .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.slide .foot { position: absolute; left: 5.5%; right: 5.5%; bottom: 2.2%; display: flex; justify-content: space-between; font-size: .8em; color: var(--muted); }
.title { justify-content: center; }
.title .kick { color: var(--accent); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 1.1em; margin-bottom: .6em; }
.title p { font-size: 1.4em; margin: .2em 0; }
/* cards and big numbers */
.row { display: grid; gap: 1.2em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: .8em; padding: 1em 1.2em; min-width: 0; }
.big { font-size: 3.6em; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.card .t { color: var(--muted); font-size: 1.05em; min-height: 2.6em; }
.card .d { color: var(--muted); font-size: .95em; margin-top: .3em; }
.up { color: var(--up); font-weight: 700; } .down { color: var(--down); font-weight: 700; }
/* horizontal bars */
.bars { display: grid; gap: .45em; }
.bar { display: grid; grid-template-columns: 34% 1fr 4.5em; gap: .8em; align-items: center; font-size: 1.02em; }
.bar .tr { height: 1.15em; background: var(--h0); border-radius: .3em; overflow: hidden; display: flex; }
.bar .tr i { display: block; height: 100%; }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
i.da { background: var(--spring); } i.ne { background: var(--autumn); } i.one { background: var(--o3); }
.k1 { background: var(--o1); } .k3 { background: var(--o3); } .k4 { background: var(--o4); }
.legend { display: flex; gap: .4em 1.4em; flex-wrap: wrap; color: var(--muted); font-size: .95em; margin-bottom: .7em; }
.legend i { display: inline-block; width: .9em; height: .9em; border-radius: .2em; vertical-align: -.1em; margin-right: .35em; }
/* strongest / weakest */
.hab { font-size: .88em; }
.hab .card { padding: .8em 1em; }
.hab h3 { font-size: 1.25em; margin: 0 0 .2em; }
.hab .grp { font-size: .85em; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin: .45em 0 .2em; }
.hab .grp.hi { color: var(--spring); } .hab .grp.lo { color: var(--autumn); }
.hab .it { display: grid; grid-template-columns: 1fr auto; gap: .6em; padding: .18em 0; border-bottom: 1px solid var(--line); font-size: .98em; }
.hab .it b { font-variant-numeric: tabular-nums; }
.hab .c { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: .85em; margin-right: .4em; }
/* heat map */
table { border-collapse: separate; border-spacing: .2em; width: 100%; font-size: 1em; }
th, td { padding: .32em .5em; text-align: center; font-variant-numeric: tabular-nums; border-radius: .25em; }
th { color: var(--muted); font-weight: 600; } th:first-child, td:first-child { text-align: left; }
td.w { color: #fff; } td.b { color: #0b0b0b; } td.na { color: var(--muted); background: var(--h0); }
/* how-to slides for teachers (18 Nov 2026) */
.howto { display: grid; grid-template-columns: 1fr auto; gap: 2.2em; align-items: start; }
.howto ol, .howto ul { margin: 0; padding-left: 1.3em; display: grid; gap: .55em; font-size: 1.12em; }
.howto li b { color: var(--accent); }
.howto .side { text-align: center; }
.howto .side .qr { width: 11em; height: 11em; background: #fff; padding: .5em; border-radius: .6em; border: 1px solid var(--line); }
.howto .side .qr svg { width: 100%; height: 100%; display: block; }
.howto .link { font-weight: 800; font-size: 1.1em; margin-top: .5em; word-break: break-all; }
.howto .note { color: var(--muted); font-size: .9em; margin-top: .3em; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4em; }
.cols2 h3 { margin: 0 0 .4em; font-size: 1.25em; }
.cols2 ul, .cols2 ol { margin: 0; padding-left: 1.2em; display: grid; gap: .4em; font-size: 1.02em; }
.tip { margin-top: .9em; padding: .55em .9em; border-left: .3em solid var(--accent); background: var(--card); border-radius: .3em; font-size: 1em; }
/* why and end-of-year analysis (19 Nov 2026) */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1.6em; margin: .4em 0 1.2em; }
.flow .st { background: var(--card); border: 1px solid var(--line); border-radius: .7em; padding: .7em .8em; position: relative; }
.flow .st b { display: block; color: var(--accent); font-size: .85em; letter-spacing: .04em; text-transform: uppercase; margin-bottom: .25em; }
.flow .st:not(:last-child)::after { content: '→'; position: absolute; right: -1.25em; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.3em; }
.goal { font-size: 1.3em; line-height: 1.35; margin: 0 0 .6em; }
.an { display: grid; grid-template-columns: 1fr 1fr; gap: .55em 1.4em; font-size: .92em; }
.an .it { background: var(--card); border: 1px solid var(--line); border-radius: .7em; padding: .45em .8em; line-height: 1.3; }
.an .it b { display: block; font-size: 1.05em; margin-bottom: .15em; }
.an .it span { color: var(--muted); font-size: .92em; }
ul.next { font-size: 1.35em; display: grid; gap: .7em; padding-left: 1.2em; margin: .4em 0 0; }
/* controls */
#nav { position: fixed; right: 12px; bottom: 10px; display: none; gap: 6px; align-items: center; z-index: 5; opacity: .35; transition: opacity .2s; }
#nav:hover, #nav:focus-within { opacity: 1; }
#nav button, #nav a { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; text-decoration: none; }
#nav span { font-size: 13px; color: var(--muted); min-width: 48px; text-align: center; }
@media print {
  @page { size: A4 landscape; margin: 0; }
  html, body { height: auto; overflow: visible; }
  #nav, #login { display: none !important; }
  #deck { position: static; display: block !important; }
  .slide { display: flex !important; width: 297mm; height: 209mm; font-size: 3.9mm; page-break-after: always; break-after: page; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  const { ST, STRAT, TRIADS } = VPR;
  const MIN_CLASS = 3;                                   // classes with fewer answers are not shown (teacher's decision for this page)
  const pct = x => x == null || isNaN(x) ? '—' : Math.round(x * 100) + ' %';
  const ppN = (a, b) => Math.round(b * 100) - Math.round(a * 100);
  const pp = (a, b) => { const d = ppN(a, b); return (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d) + ' o. t.'; };
  const dc = (a, b) => ppN(a, b) > 0 ? 'up' : ppN(a, b) < 0 ? 'down' : '';
  const fmtN = n => n === 1 ? '1 učenec' : n === 2 ? '2 učenca' : n === 3 || n === 4 ? n + ' učenci' : n + ' učencev';

  let P = [], meta = {}, S1L = {}, late = false, K = 'zacetno';
  // share of pupils (of those who answered round k and have the item) for whom test(answers) holds
  const share = (list, k, has, test) => { const r = list.map(p => p.r[k]).filter(a => a && has(a)); return { v: r.filter(test).length / (r.length || 1), n: r.length }; };
  const topShare = (list, k, c) => share(list, k, a => a[c] != null, a => a[c] >= a._top);
  const hasS1 = a => Object.keys(a).some(x => x.startsWith('S1_'));

  // ---- slides: each returns [title, subtitle, body node] or null to skip. New data → add a function to SLIDES. ----
  const slide = (title, sub, body, cls) => { const s = el('section', 'slide' + (cls ? ' ' + cls : '')); if (title) s.append(el('h2', '', title)); if (sub) s.append(el('p', 'sub', sub)); const b = el('div', 'body'); if (body) b.append(...[].concat(body)); s.append(b); return s; };
  const bar = (label, v, cls, txt) => { const r = el('div', 'bar'), tr = el('div', 'tr'), i = el('i', cls); i.style.width = Math.max(0, Math.min(1, v)) * 100 + '%'; tr.append(i); r.append(el('div', '', label), tr, el('div', 'v', txt != null ? txt : pct(v))); return r; };

  const sTitle = () => {
    const s = el('section', 'slide title'), yr = String(meta.year || '').replace('-', '/');
    s.append(el('div', 'kick', 'Samouravnavanje učenja · OŠ Veržej'), el('h1', '', 'Kako se učimo?'),
      el('p', '', late ? 'Začetno in končno merjenje ' + yr : 'Rezultati začetnega merjenja ' + yr),
      el('p', 'muted', 'Vprašalnik »Kako se učim?« · ' + fmtN(P.filter(p => p.r[K]).length) + ' · zadnja oddaja ' + (meta.last || '—')));
    return s;
  };
  const sWho = () => {
    const n = k => P.filter(p => p.r[k]).length;
    const cards = el('div', 'row'); cards.style.gridTemplateColumns = 'repeat(4, minmax(0, 1fr))';
    const card = (t, v, d) => { const c = el('div', 'card'); c.append(el('div', 't', t), el('div', 'big', String(v)), el('div', 'd', d)); return c; };
    cards.append(card('Vsi učenci', n(K), late ? 'jeseni ' + n('zacetno') : 'začetno merjenje'));
    TRIADS.forEach(([v, name, g]) => { const L = P.filter(p => p.vio === Number(v)); cards.append(card(name + ' (' + g + ')', L.filter(p => p.r[K]).length, late ? 'jeseni ' + L.filter(p => p.r.zacetno).length : '')); });
    const cl = [...new Set(P.map(p => p.cls).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sl', { numeric: true }));
    const max = Math.max(1, ...cl.map(c => P.filter(p => p.cls === c && p.r[K]).length));
    const bars = el('div', 'bars'); bars.style.marginTop = '1.4em'; const ncol = cl.length > 10 ? 3 : 2;
    bars.style.gridTemplateColumns = 'repeat(' + ncol + ', minmax(0, 1fr))'; bars.style.columnGap = '3em';
    bars.style.gridAutoFlow = 'column'; bars.style.gridTemplateRows = 'repeat(' + Math.max(1, Math.ceil(cl.length / ncol)) + ', auto)';
    cl.forEach(c => { const k = P.filter(p => p.cls === c && p.r[K]).length; const b = bar(c, k / max, 'one', String(k)); b.style.gridTemplateColumns = '4em 1fr 2.5em'; bars.append(b); });
    return slide('Kdo je odgovoril', 'Število učencev, ki so oddali vprašalnik' + (late ? ' spomladi' : '') + ', po triadah in razredih.', [cards, bars]);
  };
  const sKpi = () => {
    const P23 = P.filter(p => p.vio > 1), P1 = P.filter(p => p.vio === 1);
    const K4 = [['Načrtujejo čas učenja', 'pogosto ali vedno (N3)', L => k => topShare(L, k, 'N3'), P23, '2. in 3. VIO'],
      ['Uporabljajo samopreverjanje', 'poznam in uporabljam (ST06)', L => k => share(L, k, a => a.S5_ST06 != null, a => a.S5_ST06 === 3), P23, '2. in 3. VIO'],
      ['Za test se začnejo učiti vsaj 2 dni prej', 'N7', L => k => share(L, k, a => a.N7 != null, a => a.N7 <= 3), P23, '2. in 3. VIO'],
      ['Pregledajo napake', 'pogosto ali vedno (R1)', L => k => topShare(L, k, 'R1'), P23, '2. in 3. VIO'],
      ['Pogledajo, kje so se zmotili', 'pogosto (R1)', L => k => topShare(L, k, 'R1'), P1, '1. VIO']];
    const row = el('div', 'row'); row.style.gridTemplateColumns = 'repeat(5, minmax(0, 1fr))';
    K4.forEach(([t, sub, f, L, who]) => {
      const g = f(L), a = g('zacetno'), s = late ? g('koncno') : null, c = el('div', 'card');
      c.append(el('div', 't', t), el('div', 'big', a.n ? pct(late ? s.v : a.v) : '—'));
      const d = el('div', 'd'); d.append(document.createTextNode(who + ' · ' + sub + ' · n = ' + (late ? s.n : a.n)));
      if (late && a.n && s.n) { d.append(el('br'), document.createTextNode('jeseni ' + pct(a.v) + ' · ')); d.append(el('span', dc(a.v, s.v), pp(a.v, s.v))); }
      c.append(d); row.append(c);
    });
    return slide('Ključni kazalniki', (late ? 'Končno merjenje in sprememba od jeseni (odstotne točke).' : 'Začetno merjenje.') + ' Delež učencev z zgornjimi odgovori; lestvic 1. VIO in 2./3. VIO ne mešamo.', row);
  };
  const sHabits = () => {
    const row = el('div', 'row hab'); row.style.gridTemplateColumns = 'repeat(3, minmax(0, 1fr))';
    TRIADS.forEach(([v, name, g]) => {
      const L = P.filter(p => p.vio === Number(v)), col = el('div', 'card');
      col.append(el('h3', '', name + ' · ' + g));
      const items = ST.filter(([, , t]) => t.includes(Number(v))).map(([c, l]) => ({ c, l, s: topShare(L, K, c), a: topShare(L, 'zacetno', c) })).filter(x => x.s.n && x.c !== 'P1');
      if (!items.length) { col.append(el('p', 'muted', 'Še ni odgovorov.')); row.append(col); return; }
      items.sort((x, y) => y.s.v - x.s.v);
      const put = (list, cls, lab) => { col.append(el('div', 'grp ' + cls, lab)); list.forEach(x => { const it = el('div', 'it'), l = el('span'); l.append(el('span', 'c', x.c), document.createTextNode(x.l)); const b = el('b', '', pct(x.s.v)); if (late) { b.append(document.createTextNode(' ')); b.append(el('span', dc(x.a.v, x.s.v), pp(x.a.v, x.s.v).replace(' o. t.', ''))); } it.append(l, b); col.append(it); }); };
      const n = Math.min(3, Math.floor(items.length / 2));
      put(items.slice(0, n), 'hi', 'Najmočnejše'); put(items.slice(-n).reverse(), 'lo', 'Najšibkejše');
      col.append(el('div', 'muted', 'n = ' + L.filter(p => p.r[K]).length)); col.lastChild.style.cssText = 'font-size:.85em;margin-top:.5em';
      row.append(col);
    });
    return slide('Najmočnejše in najšibkejše navade', 'Trditve z največjim in najmanjšim deležem zgornjih odgovorov (2. in 3. VIO pogosto ali vedno, 1. VIO pogosto)' + (late ? ', spomladi in sprememba od jeseni.' : '.'), row);
  };
  const sStrat23 = () => {
    const L = P.filter(p => p.vio > 1 && p.r[K]); if (!L.length) return null;
    const d = c => { const r = L.map(p => p.r[K]).filter(a => a['S5_' + c] != null), n = r.length || 1; return [3, 2, 1].map(v => r.filter(a => a['S5_' + c] === v).length / n); };
    const lg = el('div', 'legend'); [['k4', 'poznam in uporabljam'], ['k3', 'poznam, ne uporabljam'], ['k1', 'ne poznam']].forEach(([c, l]) => { const s = el('span'); s.append(el('i', c), document.createTextNode(l)); lg.append(s); });
    const bars = el('div', 'bars'); bars.style.gap = '.2em'; bars.style.fontSize = '.9em';
    STRAT.map(([c, l]) => ({ c, l, d: d(c) })).sort((x, y) => y.d[0] - x.d[0]).forEach(x => {
      const r = el('div', 'bar'), tr = el('div', 'tr'); tr.style.gap = '2px'; tr.style.background = 'none';
      ['k4', 'k3', 'k1'].forEach((cl, i) => { const s = el('i', cl); s.style.width = x.d[i] * 100 + '%'; tr.append(s); });
      r.append(el('div', '', x.l), tr, el('div', 'v', pct(x.d[0]))); bars.append(r);
    });
    return slide('Katere strategije poznajo in uporabljajo', '2. in 3. VIO' + (late ? ', končno merjenje' : '') + ', n = ' + L.length + '. Razvrščeno po deležu »poznam in uporabljam« (številka desno).', [lg, bars]);
  };
  const sStrat1 = () => {
    const L = P.filter(p => p.vio === 1 && p.r[K] && hasS1(p.r[K])); if (!L.length) return null;
    const A = P.filter(p => p.vio === 1 && p.r.zacetno && hasS1(p.r.zacetno));
    const rows = Object.keys(S1L).map(c => ({ c, l: S1L[c], s: L.filter(p => p.r[K]['S1_' + c]).length / L.length, a: A.filter(p => p.r.zacetno['S1_' + c]).length / (A.length || 1) })).sort((x, y) => y.s - x.s);
    const bars = el('div', 'bars'); bars.style.gap = '.6em';
    rows.forEach(x => bars.append(bar(x.l.charAt(0).toUpperCase() + x.l.slice(1), x.s, late ? 'da' : 'one', pct(x.s) + (late ? ' (' + pp(x.a, x.s).replace(' o. t.', '') + ')' : ''))));
    return slide('Kako se učijo učenci 1. VIO', 'Vprašanje »Kako se učiš?« (več odgovorov): delež učencev, ki so izbrali posamezen način' + (late ? ', spomladi in sprememba od jeseni' : '') + '. n = ' + L.length + '.', bars);
  };
  const sClasses = () => {
    const cl = [...new Set(P.map(p => p.cls).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sl', { numeric: true })); if (!cl.length) return null;
    const COLS = [['N3 načrtuje', a => a.N3 != null, a => a.N3 >= a._top], ['M1 preverja, ali razume', a => a.M1 != null, a => a.M1 >= a._top], ['R1 pregleda napake', a => a.R1 != null, a => a.R1 >= a._top],
      ['ST06 samopreverjanje', a => a.S5_ST06 != null, a => a.S5_ST06 === 3], ['N7 zgodnji začetek', a => a.N7 != null, a => a.N7 <= 3]];
    const heat = v => v < 0.2 ? 1 : v < 0.4 ? 2 : v < 0.6 ? 3 : v < 0.8 ? 4 : 5, dark = document.body.classList.contains('dark');
    // at most PER_SLIDE classes on one slide (readable on a projector); more classes → more slides "Primerjava razredov (1/2)"
    const PER_SLIDE = 8, parts = Math.ceil(cl.length / PER_SLIDE), per = Math.ceil(cl.length / parts);
    return Array.from({ length: parts }, (_, pi) => {
    const t = el('table'), hr = el('tr'); hr.append(el('th', '', 'Razred'), el('th', '', 'n')); COLS.forEach(c => hr.append(el('th', '', c[0]))); t.append(hr);
    cl.slice(pi * per, (pi + 1) * per).forEach(c => {
      const L = P.filter(p => p.cls === c), n = L.filter(p => p.r[K]).length, tr = el('tr'); tr.append(el('td', '', c), el('td', '', String(n)));
      if (n < MIN_CLASS) { const td = el('td', 'na', 'premalo odgovorov'); td.colSpan = COLS.length; tr.append(td); t.append(tr); return; }
      COLS.forEach(([, has, ok]) => {
        const s = share(L, K, has, ok); if (!s.n) { tr.append(el('td', 'na', '—')); return; }
        const a = share(L, 'zacetno', has, ok), h = heat(s.v), td = el('td', dark ? (h === 5 ? 'b' : 'w') : (h >= 4 ? 'w' : ''));
        td.style.background = 'var(--h' + h + ')'; td.textContent = pct(s.v) + (late ? ' (' + pp(a.v, s.v).replace(' o. t.', '') + ')' : ''); tr.append(td);
      });
      t.append(tr);
    });
    return slide('Primerjava razredov' + (parts > 1 ? ' (' + (pi + 1) + '/' + parts + ')' : ''), (late ? 'Končni delež, v oklepaju sprememba od jeseni. ' : 'Začetni delež zgornjih odgovorov. ') + 'Temnejša celica = večji delež. »—« = vprašanja v tej triadi ni. Razred z manj kot ' + MIN_CLASS + ' odgovori ni prikazan.', t);
    });
  };
  // ---- why we do this, and what we analyse at the end of the year (19 Nov 2026; agreed by the team). Text only, no data. ----
  const sWhy = () => {
    const goal = el('p', 'goal', 'Cilj: učenci se naučijo, kako se učiti – da znajo načrtovati učenje, med učenjem preveriti, ali razumejo, pregledati napake in izbrati način učenja, ki jim pomaga.');
    const flow = el('div', 'flow');
    [['Jeseni', 'Vprašalnik »Kako se učim?« – kje so naši učenci zdaj (izhodišče).'],
     ['Med letom', 'Pri pouku uvajamo izbrane učne strategije po štirih korakih.'],
     ['Po uri', 'Kratek zapis v opazovalni list: kaj smo uvajali in kako je delovalo.'],
     ['Spomladi', 'Isti vprašalnik še enkrat – kaj se je spremenilo.'],
     ['Ob koncu leta', 'Skupaj pogledamo, kaj pri naših učencih deluje, in načrtujemo naslednje leto.']]
      .forEach(([t, x]) => { const d = el('div', 'st'); d.append(el('b', '', t), document.createTextNode(x)); flow.append(d); });
    const tip = el('div', 'tip', 'Vprašalnik ni ocenjevanje učencev ali učiteljev. Pove nam, katere navade učencem manjkajo in ali to, kar delamo pri pouku, pomaga.');
    return slide('Zakaj to delamo', 'Samouravnavanje učenja – eno šolsko leto v petih korakih.', [goal, flow, tip]);
  };
  const sEnd = () => {
    const g = el('div', 'an');
    [['1 · Jesen in pomlad', 'Kako so se spremenile navade (načrtovanje, sprotno delo, preverjanje, pregled napak …) po triadah in razredih.'],
     ['2 · Strategije pri pouku', 'Ali učenci strategije, ki smo jih uvajali, spomladi pogosteje poznajo in uporabljajo – razrede z uvedeno strategijo (opazovalni listi) primerjamo z drugimi.'],
     ['3 · Glas učencev', 'Spomladi tudi kratko vprašanje, ali so kaj spremenili pri učenju in kaj jim je pri tem pomagalo (predlog, o vprašanjih odloči skupina).'],
     ['4 · Navade in ocene (2. in 3. VIO)', 'Povprečne ocene po predmetnih sklopih pri učencih z navado in brez nje ter sprememba ocen in navad med letom – vedno kot povezava, ne vzrok.'],
     ['5 · Izbrane povezave', 'Nekaj vnaprej izbranih parov, npr. ali tisti, ki načrtujejo čas, tudi prej začnejo z učenjem – samo, kjer je odgovorov dovolj.'],
     ['6 · Za naslednje leto', 'Katere strategije obdržimo, kje začnemo prej in kaj spremenimo pri vprašalniku ali opazovalnem listu.']]
      .forEach(([t, x]) => { const d = el('div', 'it'); d.append(el('b', '', t), el('span', '', x)); g.append(d); });
    const tip = el('div', 'tip', 'Razrednik bo videl napredek učencev svojega razreda. Vsi drugi vidijo samo skupne številke; razred mora imeti vsaj 3 odgovore. Imena vidita samo razvojna skupina in razrednik.');
    return slide('Kaj bomo analizirali ob koncu leta', 'Dogovor razvojne skupine – da veste, zakaj zbiramo podatke.', [g, tip]);
  };
  // ---- for teachers: how to use the pages "Kako se učim" (18 Nov 2026). Text only, no data. ----
  const LINK = 'noisy.splet.arnes.si/razvojna-skupina';
  const li = (list, items) => { items.forEach(x => { const e = el('li'); if (Array.isArray(x)) { e.append(el('b', '', x[0]), document.createTextNode(x[1])); } else e.textContent = x; list.append(e); }); return list; };
  const sAccess = () => {
    const box = el('div', 'howto'), steps = li(el('ol'), [
      ['Odprite ', 'spletno stran NoisyClassRoom, meni »Kako se učim« (povezava desno).'],
      ['Prijavite se ', 's šolskim Google računom (ime.priimek@os-verzej.si) – z gumbom za prijavo z Googlom.'],
      ['Na domači strani ', 'so kartice: priročnik, izbira strategije, opazovalni list, obvestila in strategija meseca.'],
      'Če piše »Ta račun nima dostopa«, se obrnite na razvojno skupino – dostop dobi vsak učitelj šole.',
      'Deluje na računalniku, tablici in telefonu.']);
    const side = el('div', 'side');
    if (window.QR_SVG) { const q = el('div', 'qr'); q.innerHTML = window.QR_SVG; side.append(q); }
    side.append(el('div', 'link', LINK), el('div', 'note', window.QR_SVG ? 'Skenirajte s telefonom' : ''));
    box.append(steps, side);
    return slide('Kako se učim – za učitelje', 'Strani za uvajanje učnih strategij so na šolski spletni strani. Učenci jih ne vidijo.', box);
  };
  const sGuide = () => {
    const c = el('div', 'cols2'), a = el('div'), b = el('div');
    a.append(el('h3', '', '📘 Priročnik »Učne strategije v razredu«'), li(el('ul'), [
      ['Štirje koraki uvajanja: ', '1 predstavim · 2 vodena vaja · 3 samostojno · 4 refleksija.'],
      'Strategije po triadah in predmetnih sklopih, primeri za razred.',
      'Pasti in kako spremljati, ali strategija deluje.',
      'Strategija meseca je na domači strani.']));
    b.append(el('h3', '', '🎯 Izbira strategije in priprava ure'), li(el('ol'), [
      ['Vpišite ', 'razred (ali triado), predmet, vrsto snovi in korak uvajanja.'],
      ['Dobite ', 'do tri predloge strategij; eno izberite za pripravo.'],
      ['Natisnite ', 'pripravo ure na eno stran A4 ali kartico za tablo.'],
      ['Po uri ', 'z gumbom »Vpiši opazovanje« odprete opazovalni list z že izpolnjenimi podatki.']]));
    c.append(a, b);
    return slide('Priročnik in izbira strategije', 'Pred uro: kaj izbrati in kako začeti.', c);
  };
  const sObs = () => {
    const c = el('div', 'cols2'), a = el('div'), b = el('div');
    a.append(el('h3', '', '📝 Po uri – v eni minuti'), li(el('ol'), [
      ['Osnovno: ', 'datum, razred, predmet, strategija, korak uvajanja, čas za strategijo (5–45 min).'],
      ['Kako je delovala: ', 'od »slabo« do »zelo dobro«.'],
      ['Koliko učencev jo je uporabilo: ', 'nekaj · približno polovica · večina · skoraj vsi.'],
      ['Odziv učencev: ', 'od »odpor« do »navdušenje«.'],
      ['So jo pozneje uporabili sami? ', 'da · ne · še ne vem (lahko spremenite pozneje).'],
      'Tema in opombe sta neobvezni – brez imen učencev.',
      '»➕ Še ena strategija pri tej uri?« za drugo strategijo pri isti uri.']));
    b.append(el('h3', '', '📂 Moja opazovanja'), li(el('ul'), [
      'Seznam vaših zapisov s filtri (razred, predmet, strategija, mesec); vsak zapis lahko uredite ali izbrišete.',
      ['»Kaj sem že uvedel«: ', 'koliko ur s posamezno strategijo po razredih in najvišji dosežen korak.'],
      ['Vprašanja in predlogi: ', 'razvojni skupini – list še izboljšujemo.']]));
    const t = el('div', 'tip', 'Svoja opazovanja vidite samo vi. Razvojna skupina bo pozneje videla skupne številke vseh učiteljev (kaj smo uvajali in kako je delovalo) – brez podatkov o učencih.');
    b.append(t);
    c.append(a, b);
    return slide('Opazovalni list', 'Kratek zapis po uri, v kateri ste uvajali ali utrjevali učno strategijo.', c);
  };
  const sNext = () => {
    const u = el('ul', 'next');
    (late ? ['Primerjava jesen–pomlad po razredih in triadah', 'Povezava navad z ocenami po predmetnih sklopih (2. in 3. VIO)', 'Izbor strategij za naslednje šolsko leto']
      : ['Zbiranje odgovorov do 21. 11. 2026', 'Uvajanje učnih strategij pri pouku in sprotni zapisi v opazovalni list',
         'Razredniki, učitelji in ravnatelj dobijo svoj pogled rezultatov, ko jih razvojna skupina odpre (razrednik vidi svoj razred)',
         'Spomladi: ponovimo vprašalnik in primerjamo jesen in pomlad', 'Povezava navad z ocenami po predmetnih sklopih (2. in 3. VIO) – vedno kot povezava, ne vzrok'])
      .forEach(x => u.append(el('li', '', x)));
    return slide('Kaj sledi', '', u);
  };
  // later: a grades slide (5a habits × end-of-year grade, 5b change in habits × change in grade) goes here once rsresults sends grades
  const SLIDES = [sTitle, sWho, sKpi, sHabits, sStrat23, sStrat1, sClasses, sWhy, sEnd, sAccess, sGuide, sObs, sNext];

  let cur = 0, nodes = [];
  try { cur = Number(sessionStorage.getItem('zbor.cur')) || 0; } catch (e) {}
  const build = () => {
    const deck = $('#deck'); deck.innerHTML = '';
    nodes = [].concat(...SLIDES.map(f => f())).filter(Boolean);       // a slide function may return several slides
    nodes.forEach((s, i) => { const f = el('div', 'foot'); f.append(el('span', '', 'Kako se učimo? · ' + String(meta.year || '').replace('-', '/')), el('span', '', (i + 1) + ' / ' + nodes.length)); if (i) s.append(f); deck.append(s); });
    show(Math.min(cur, nodes.length - 1));
  };
  // safety net: shrink a slide's content until it fits (long labels, many rows); never below 55 %
  const fit = s => { const b = s.querySelector('.body'); if (!b) return; let f = 1; b.style.fontSize = ''; while (b.scrollHeight > b.clientHeight + 1 && f > 0.56) { f -= 0.05; b.style.fontSize = f + 'em'; } };
  const fitAll = () => { nodes.forEach((s, k) => { nodes.forEach((x, j) => x.classList.toggle('on', j === k)); fit(s); }); nodes.forEach((s, k) => s.classList.toggle('on', k === cur)); };
  addEventListener('resize', () => { if (nodes.length) fit(nodes[cur]); });
  addEventListener('beforeprint', () => { if (nodes.length) fitAll(); });
  const show = i => { cur = Math.max(0, Math.min(nodes.length - 1, i)); nodes.forEach((s, k) => s.classList.toggle('on', k === cur)); fit(nodes[cur]); $('#pos').textContent = (cur + 1) + ' / ' + nodes.length; try { sessionStorage.setItem('zbor.cur', String(cur)); } catch (e) {} };
  const full = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  document.addEventListener('keydown', e => {
    if (!nodes.length || e.altKey || e.ctrlKey || e.metaKey) return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(0); else if (e.key === 'End') show(nodes.length - 1);
    else if (e.key === 'f' || e.key === 'F') full();
  });
  $('#deck').addEventListener('click', e => { if (e.target.closest('a,button')) return; show(cur + (e.clientX > innerWidth / 3 ? 1 : -1)); });
  $('#prev').onclick = () => show(cur - 1); $('#next').onclick = () => show(cur + 1); $('#full').onclick = full; $('#print').onclick = () => print();
  $('#theme').onclick = () => { document.body.classList.toggle('dark'); try { localStorage.setItem('zbor.dark', document.body.classList.contains('dark') ? '1' : ''); } catch (e) {} if (nodes.length) build(); };
  try { if (localStorage.getItem('zbor.dark')) document.body.classList.add('dark'); } catch (e) {}

  const api = async action => {
    const token = Track.token(); if (!token) throw new Error('token');
    const r = await fetch(Track.config.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token }) });
    return r.json();
  };
  let loading = false;
  const load = async () => {
    if (!Track.token() || loading || nodes.length) return;
    loading = true; $('#loginMsg').textContent = 'Nalagam …';
    // one request only (18 Nov 2026, speed): rsresults checks the sign-in and the access list on the server; this page is for the
    // development team, so it also needs view.team (other roles would only get what their own view allows anyway)
    let j = null; try { j = await api('rsresults'); } catch (e) {}
    loading = false;
    if (!j || !j.ok || !(j.view && j.view.team)) {
      $('#loginMsg').textContent = j && j.ok || j && j.error === 'closed' ? 'Predstavitev je samo za razvojno skupino.' : j && j.error === 'access' ? 'Ta račun nima dostopa. Obrnite se na razvojno skupino.'
        : j && j.error === 'token' ? 'Prijava je potekla. Prijavite se znova.' : 'Rezultatov trenutno ni mogoče naložiti. Poskusite znova čez nekaj minut.';
      if (!j || j.error === 'token') Track.button($('#slot'));
      return;
    }
    meta = j; S1L = j.s1 || {};
    P = VPR.pupils(j).map(p => ({ cls: p.cls, vio: p.vio, r: p.r }));      // names are dropped here: this page shows aggregates only
    late = P.some(p => p.r.koncno); K = late ? 'koncno' : 'zacetno';
    $('#login').style.display = 'none'; $('#deck').style.display = 'flex'; $('#nav').style.display = 'flex';
    build();
  };
  if (window.Track && Track.enabled) {
    Track.onChange(() => { if (Track.token()) load(); });
    Track.init(() => { if (Track.token()) load(); else Track.button($('#slot')); });
  } else $('#loginMsg').textContent = 'Prijava ni nastavljena.';
})();
</script>
